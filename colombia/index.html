document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n-top:32px;\n    box-shadow:0 12px 40px rgba(0,0,0,.55);\n  }\n  /* Calculadora de dosis: apila en columna en pantallas pequeñas */\n  #hm-calc{\n    flex-wrap:wrap;\n    gap:8px;\n  }\n  #hm-calc > div:last-child{\n    margin-left:0 !important;\n    width:100%;\n    display:flex;\n    gap:8px;\n  }\n  /* Cajas de dosis ocupan mitad del ancho */\n  #hm-calc > div:last-child > div{\n    flex:1;\n    min-width:0;\n  }\n  /* Tabs del guide más compactos */\n  #hm-tab-seq, #hm-tab-pharma, #hm-tab-score{\n    font-size:8.5px !important;\n    padding:0 7px !important;\n    letter-spacing:.02em !important;\n  }\n}\n@media(max-width:600px){\n  .sec{padding:36px 20px}\n  .cg-head-inner{padding:0 20px}\n  .sec-h{font-size:26px}\n  .cg-foot-inner{grid-template-columns:1fr;gap:24px}\n  .logos-strip{padding:14px 20px}\n  .logos-row{gap:16px}\n  .cta-final{padding:56px 20px}\n  .cg-foot{padding:24px 20px}\n  .compare-wrap{grid-template-columns:1fr}\n  .plans-grid{grid-template-columns:1fr}\n  .hero-proof{grid-template-columns:repeat(2,1fr)}\n\n  /* ── FIX PRICING INLINE OVERRIDE ── */\n  #plans-grid-main{\n    grid-template-columns:1fr !important;\n    max-width:100% !important;\n  }\n\n  /* ── LIME BANNER MOBILE ── */\n  .stats-bar{padding:14px 20px; border-top:none !important;}\n  .stats-bar .stats-inner{\n    grid-template-columns:1fr !important;\n    gap:0 !important;\n    text-align:center;\n  }\n  .stats-bar .stats-inner > div{\n    border:none !important;\n    padding:7px 0 !important;\n  }\n  .stats-bar .stats-inner > div:nth-child(2){\n    border-top:1px solid rgba(0,0,0,0.12) !important;\n    border-bottom:1px solid rgba(0,0,0,0.12) !important;\n    font-size:12px !important;\n    padding:8px 4px !important;\n  }\n\n  /* ── PAIN STACK MOBILE ── */\n  .pain-grid{\n    display:flex !important;\n    flex-direction:column !important;\n    gap:12px !important;\n    background:none !important;\n    overflow:visible !important;\n    padding:0 !important;\n    margin:0 !important;\n  }\n  .pain-cell{\n    flex:none !important;\n    width:100% !important;\n    border-radius:var(--r-md) !important;\n    padding:18px 16px 18px 60px !important;\n    position:relative !important;\n    counter-increment:pain-counter;\n  }\n  .pain-cell::before{\n    content:counter(pain-counter);\n    position:absolute;\n    left:16px; top:50%; transform:translateY(-50%);\n    font-size:28px; font-weight:700;\n    color:rgba(173,220,0,.18);\n    line-height:1; letter-spacing:-.04em;\n    font-family:var(--font);\n  }\n  .pain-grid{ counter-reset:pain-counter; }\n  /* Accent line left */\n  .pain-cell::after{\n    content:'' !important;\n    position:absolute !important;\n    left:0 !important; top:0 !important; bottom:0 !important;\n    width:2px !important; height:100% !important;\n    background:var(--lime) !important;\n    opacity:0 !important;\n    border-radius:0 0 0 var(--r-md) !important;\n    transition:opacity .2s !important;\n  }\n  .pain-cell:hover::after{ opacity:.5 !important; }\n\n  /* ── TESTIMONIALS CAROUSEL MOBILE ── */\n  .testi-grid{\n    display:flex !important;\n    overflow-x:auto;\n    scroll-snap-type:x mandatory;\n    -webkit-overflow-scrolling:touch;\n    gap:12px;\n    padding:0 20px 16px;\n    margin:0 -20px;\n    scrollbar-width:none;\n  }\n  .testi-grid::-webkit-scrollbar{display:none}\n  .testi-card{\n    flex:0 0 82vw;\n    scroll-snap-align:start;\n  }\n\n  /* ── PAIN STACK BACKGROUNDS ── */\n  .pain-grid{background:transparent !important}\n  .pain-cell{\n    background:var(--bg-card) !important;\n    border:0.5px solid var(--border-hi) !important;\n  }\n  .pain-cell:hover{background:var(--bg-hover) !important}\n  .pain-q{\n    color:var(--t1) !important;\n    font-size:13px !important;\n    font-style:normal !important;\n    font-weight:600 !important;\n    margin-bottom:4px !important;\n  }\n  .pain-q::before{ display:none !important; }\n  .pain-a{\n    color:var(--t3) !important;\n    font-size:12px !important;\n    border-top:none !important;\n    padding-top:0 !important;\n    margin-top:0 !important;\n  }\n\n  /* ── TESTIMONIALS CAROUSEL BACKGROUNDS ── */\n  .testi-grid{background:transparent !important}\n  .testi-card{background:#000 !important}\n  .testi-card:hover{background:#000 !important}\n  .testi-q{color:var(--t3) !important}\n\n\n  /* ── PRODUCT SECTION MOBILE ── */\n\n\n\n  /* ── SWAP: hero shows animated mockup, product section shows static list ── */\n  #hero-mockup-anim{ display:block !important; }\n  .hero-static-list{ display:none !important; }\n  #prod-mobile-anim-new{ display:none !important; }\n  .prod-static-list-mobile{ display:block !important; }\n\n  .prod-tag-desktop{ display:none !important; }\n  .prod-tag-mobile{ display:inline !important; }\n  .prod-title{ display:none !important; }\n  .prod-title-mobile{ display:block !important; }\n  .prod-mobile-subtitle{ display:block !important; }\n  .prod-desc{ display:none !important; }\n  .demo-header{ grid-template-columns:1fr !important; }\n  .demo-layout{ grid-template-columns:1fr !important; }\n  .demo-features{ display:none !important; }\n  .full-mock{ display:none !important; }\n\n  .prod-mobile-block{ display:flex !important; flex-direction:column; gap:24px; }\n  .prod-mobile-anim{ width:100%; }\n\n  .prod-mobile-feats{\n    display:flex;\n    flex-direction:column;\n    gap:0;\n    border-top:0.5px solid var(--sep);\n  }\n  .prod-mobile-feat{\n    padding:16px 4px;\n    border-bottom:0.5px solid var(--sep);\n  }\n  .prod-mobile-feat-title{\n    font-size:14px;font-weight:600;color:var(--t1);\n    margin-bottom:5px;letter-spacing:-.01em;\n  }\n  .prod-mobile-feat-title::before{\n    content:'';display:inline-block;\n    width:6px;height:6px;border-radius:50%;\n    background:var(--lime);margin-right:8px;\n    vertical-align:middle;\n  }\n  .prod-mobile-feat-body{\n    font-size:13px;color:var(--t3);line-height:1.65;\n    padding-left:14px;\n  }\n\n\n  /* ── CAROUSEL HINT DOTS ── */\n  .carousel-hint{\n    display:flex;\n    justify-content:center;\n    gap:5px;\n    margin-top:12px;\n  }\n  .carousel-hint span{\n    width:5px;height:5px;border-radius:50%;\n    background:var(--border);display:inline-block;\n  }\n  .carousel-hint span:first-child{background:var(--lime)}\n\n\n  /* ── PARA QUIÉN ES — cards en columna con acordeón ── */\n  .para-quien-sec{\n    padding:36px 20px !important;\n  }\n  .para-quien-grid{\n    display:flex !important;\n    flex-direction:column !important;\n    gap:0 !important;\n    background:none !important;\n    border-radius:0 !important;\n    overflow:visible !important;\n  }\n  .pq-card{\n    border-radius:0 !important;\n    border:none !important;\n    border-bottom:0.5px solid var(--sep) !important;\n    padding:0 !important;\n    background:transparent !important;\n    position:relative !important;\n  }\n  .pq-card:first-child{ border-top:0.5px solid var(--sep) !important; }\n  /* Header clickable */\n  .pq-header{\n    display:flex;\n    align-items:center;\n    gap:12px;\n    padding:16px 4px;\n    cursor:pointer;\n  }\n  .pq-emoji{ font-size:22px; flex-shrink:0; }\n  .pq-title{\n    font-size:14px;font-weight:700;color:var(--t1);\n    flex:1;letter-spacing:-.01em;\n  }\n  .pq-arrow{\n    font-size:11px;color:var(--t4);\n    transition:transform .25s ease;\n    flex-shrink:0;\n  }\n  .pq-card.open .pq-arrow{ transform:rotate(180deg); color:var(--lime-text); }\n  .pq-card.open .pq-title{ color:var(--lime-text); }\n  /* Body collapsible */\n  .pq-body{\n    max-height:0;overflow:hidden;\n    transition:max-height .3s ease, padding .3s ease;\n    padding:0 4px;\n  }\n  .pq-card.open .pq-body{\n    max-height:200px;\n    padding:0 4px 16px;\n  }\n  .pq-body p{\n    font-size:13px;color:var(--t3);line-height:1.65;\n    margin:0;\n  }\n\n\n\n  /* ── Stats bar: rediseño móvil en grid ── */\n  .stats-inner        { display: none !important; }\n  .stats-mobile       { display: block !important; }\n  .stats-bar          { padding: 20px 20px !important; }\n  .stats-mobile-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 0; }\n  .stats-mobile-card  { display: none; }\n  .stats-mobile-full  { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: transparent; border-top: 1px solid rgba(0,0,0,.15); padding: 14px 16px; }\n\n  /* ── Footer links más cómodos ── */\n  .f-links{ gap: 10px !important; }\n  .stats-mobile-n     { font-size: 30px; font-weight: 700; color: #000; letter-spacing: -.05em; line-height: 1; margin-bottom: 5px; }\n  .stats-mobile-l     { font-size: 10px; font-weight: 600; color: rgba(0,0,0,.50); letter-spacing: .08em; text-transform: uppercase; }\n  .stats-mobile-founders { font-size: 10px; font-weight: 700; color: rgba(0,0,0,.55); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }\n  .stats-mobile-off   { font-size: 20px; font-weight: 700; color: #000; letter-spacing: -.03em; line-height: 1.1; }\n  .stats-mobile-date  { font-size: 10px; font-weight: 500; color: rgba(0,0,0,.50); margin-top: 3px; }\n}\n\n/* ─── HERO MOCKUP ALTURA FIJA DESKTOP ─── */\n@media(min-width:901px){\n  #hero-mockup-anim .hero-mockup{\n    height:480px;\n    overflow:hidden;\n  }\n}\n\n/* ─── PRODUCT SECTION — DESKTOP ONLY ─── */\n@media(min-width:901px){\n\n  /* demo-header: sin el grid de 2 cols original */\n  .demo-header{\n    grid-template-columns:1fr !important;\n    margin-bottom:48px !important;\n  }\n\n  /* El div interno usa grid 2 cols: texto izq, pipeline der */\n  .demo-header > div:first-child{\n    display:grid;\n    grid-template-columns:1fr 380px;\n    grid-template-rows:auto auto auto;\n    gap:0 56px;\n    width:100%;\n    align-items:start;\n  }\n\n  /* Ocultar prod-desc */\n  .prod-desc{ display:none !important; }\n\n  /* Texto: col 1 */\n  .demo-header .sec-tag{\n    grid-column:1; grid-row:1;\n    margin-bottom:10px;\n  }\n  .demo-header .prod-title{\n    grid-column:1; grid-row:2;\n  }\n  .demo-header .prod-title-mobile{ display:none !important; }\n\n  /* Párrafo: col 1, fila 3 */\n  .prod-mobile-subtitle{\n    display:block !important;\n    grid-column:1; grid-row:3;\n    font-size:14px;\n    color:var(--t3);\n    line-height:1.7;\n    margin-top:16px !important;\n  }\n\n  /* Pipeline: col 2, abarca todas las filas */\n  .pipe-anim-mobile{\n    display:flex !important;\n    flex-direction:column;\n    grid-column:2;\n    grid-row:1 / 4;\n    margin-top:0 !important;\n    background:var(--bg-card);\n    border:0.5px solid var(--border-hi);\n    border-radius:var(--r-lg);\n    padding:24px 20px;\n    align-self:center;\n  }\n\n  /* FILA 2: demo-layout como flex-row\n     Izquierda: 4 features  |  Derecha: lista de guías (mismo ancho que pipeline) */\n  .demo-layout{\n    display:flex !important;\n    flex-direction:row !important;\n    gap:56px;\n    align-items:start;\n    grid-template-columns:unset !important;\n  }\n  .demo-features{\n    display:flex !important;\n    flex:1;\n    min-width:0;\n  }\n  .prod-static-list-mobile{\n    display:block !important;\n    flex:0 0 380px;\n    min-width:0;\n  }\n\n  /* Ocultar lo que no va en desktop */\n  .full-mock{ display:none !important; }\n  .prod-mobile-block{ display:none !important; }\n  .prod-mobile-feats{ display:none !important; }\n  .carousel-hint{ display:none !important; }\n  .prod-title-mobile{ display:none !important; }\n\n  /* ── Pricing: título y elementos de card iguales a móvil ── */\n  .pricing-title-desktop{ display:none !important; }\n  .pricing-title-mobile{ display:block !important; }\n  .mobile-off-badge{\n    display:inline-flex !important;\n    background:var(--lime);color:#000;\n    font-size:9px;font-weight:800;letter-spacing:.06em;\n    padding:3px 8px;border-radius:var(--r-pill);margin-left:4px;\n  }\n  .mobile-price-was{\n    display:inline !important;\n    font-size:18px;font-weight:500;\n    color:var(--t4);text-decoration:line-through;letter-spacing:-.02em;\n  }\n  .mobile-savings{\n    display:block !important;\n    font-size:12px;font-weight:600;\n    color:var(--lime-text);margin-bottom:4px;letter-spacing:-.01em;\n  }\n  .founders-pill{\n    display:inline-flex !important;\n    align-items:center;\n    background:var(--lime-bg);border:0.5px solid var(--lime-bdr);\n    color:var(--lime-text);font-size:9px;font-weight:700;\n    letter-spacing:.06em;text-transform:uppercase;\n    padding:2px 7px;border-radius:var(--r-pill);\n    margin-left:6px;vertical-align:middle;\n  }\n\n  /* ── Refinamiento visual encabezado \"Nuestra solución\" — desktop ── */\n\n  /* Separador decorativo entre demo-header y demo-layout */\n  .demo-header{\n    border-bottom: 0.5px solid var(--sep) !important;\n    padding-bottom: 40px !important;\n    margin-bottom: 48px !important;\n  }\n\n  /* Bloque de texto izquierdo: mejor espaciado y jerarquía */\n  .demo-header > div:first-child .sec-tag{\n    margin-bottom: 14px !important;\n    font-size: 11px !important;\n    letter-spacing: .12em !important;\n  }\n\n  /* Acento visual: línea lima a la izquierda del bloque de texto */\n  .demo-header > div:first-child{\n    padding-left: 20px !important;\n    border-left: 2px solid var(--lime) !important;\n  }\n\n  /* Título con más peso visual */\n  .demo-header .prod-title{\n    font-size: clamp(30px, 3.8vw, 48px) !important;\n    letter-spacing: -.045em !important;\n    line-height: 1.06 !important;\n    margin-bottom: 0 !important;\n  }\n\n  /* Subtítulo con espaciado calibrado */\n  .prod-mobile-subtitle{\n    margin-top: 20px !important;\n    font-size: 14px !important;\n    color: var(--t3) !important;\n    line-height: 1.75 !important;\n    max-width: 480px !important;\n  }\n\n  /* ── Estilos pipeline calibrados para desktop ── */\n  .pam-label{\n    font-size:10px;font-weight:700;letter-spacing:.1em;\n    text-transform:uppercase;color:var(--t4);\n    margin-bottom:16px;text-align:center;\n  }\n  .pam-docs{ display:flex;gap:12px;justify-content:center; }\n  .pam-doc{\n    flex:1;\n    background:var(--bg);\n    border:0.5px solid var(--border-hi);\n    border-radius:var(--r-sm);\n    padding:12px 14px;\n    opacity:0;transform:translateY(-8px);transition:all .5s ease;\n  }\n  .pam-doc.pam-vis{ opacity:1;transform:translateY(0); }\n  .pam-tag{\n    font-size:9px;font-weight:700;padding:2px 8px;\n    border-radius:20px;letter-spacing:.05em;\n    text-transform:uppercase;display:inline-block;margin-bottom:6px;\n  }\n  .pam-lang{ font-size:10px;color:var(--t4);margin-bottom:6px;font-weight:500; }\n  .pam-lines{ display:flex;flex-direction:column;gap:4px; }\n  .pam-line{ height:3px;border-radius:2px;background:var(--sep); }\n  .pam-funnel{ display:flex;justify-content:center;height:44px;margin-top:4px; }\n  .pam-result{\n    background:var(--bg);\n    border:0.5px solid rgba(173,220,0,.3);\n    border-radius:var(--r-md);\n    padding:14px 16px;\n    opacity:0;transform:translateY(8px);transition:all .7s ease;\n    margin-top:4px;\n  }\n  .pam-result.pam-vis{ opacity:1;transform:translateY(0); }\n  .pam-result-header{ display:flex;align-items:center;gap:8px;margin-bottom:10px; }\n  .pam-result-dot{\n    width:6px;height:6px;border-radius:50%;\n    background:var(--lime);animation:pulse 2s ease-in-out infinite;flex-shrink:0;\n  }\n  .pam-result-title{\n    font-size:10px;font-weight:700;color:var(--lime-text);\n    letter-spacing:.06em;text-transform:uppercase;\n  }\n  .pam-result-lines{ display:flex;flex-direction:column;gap:5px; }\n  .pam-result-line{ height:4px;border-radius:2px;background:var(--sep); }\n  .pam-result-line.hl{ background:rgba(173,220,0,.35); }\n  .pam-sources{ font-size:10px;color:var(--t4);margin-top:10px;letter-spacing:.03em; }\n  .pam-sources span{ color:var(--lime-text); }\n}\n\n\n\n/* ─── HERO MOCKUP LABEL ─── */\n.hero-mockup-label{ display:none; }\n@media(max-width:900px){\n  .hero-mockup-label{\n    display:flex;\n    align-items:center;\n    gap:10px;\n    margin-bottom:10px;\n  }\n  .hml-dot{\n    width:7px;height:7px;border-radius:50%;\n    background:var(--lime);flex-shrink:0;\n    animation:pulse 2s ease-in-out infinite;\n  }\n  .hml-text{\n    font-size:11px;font-weight:700;letter-spacing:.07em;\n    text-transform:uppercase;\n    /* shimmer: texto oscuro con barrido de brillo */\n    background:linear-gradient(\n      90deg,\n      var(--lime) 0%,\n      var(--lime) 35%,\n      #fff 50%,\n      var(--lime) 65%,\n      var(--lime) 100%\n    );\n    background-size:200% auto;\n    -webkit-background-clip:text;\n    -webkit-text-fill-color:transparent;\n    background-clip:text;\n    animation:hml-shimmer 2.2s linear infinite;\n  }\n  @keyframes hml-shimmer{\n    0%   { background-position: 100% center; }\n    100% { background-position: -100% center; }\n  }\n}\n\n/* ─── PARA QUIÉN — mostrar/ocultar según breakpoint ─── */\n.pq-header, .pq-body{ display:none; } /* oculto en desktop */\n.pq-desktop-content{ display:block; }\n@media(max-width:900px){\n  .pq-desktop-content{ display:none !important; }\n  .pq-header{ display:flex !important; }\n  .pq-body{ display:block !important; }\n}\n\n/* ══════════════════════════════════════════\n   MOBILE REORDER + COMPACT + ANIMATIONS\n   Solo afecta max-width: 600px\n   ══════════════════════════════════════════ */\n@media(max-width:600px){\n\n  /* ── Flex column para reordenar secciones ── */\n  body{\n    display:flex;\n    flex-direction:column;\n  }\n  header.cg-head          { order:0; }\n  section.hero            { order:1; }\n  [data-sec=\"stats\"]      { order:2; }\n  [data-sec=\"logos\"]      { order:3; }\n  [data-sec=\"pain\"]       { order:4; }\n  [data-sec=\"product\"]    { order:5; }\n  [data-sec=\"para-quien\"] { order:6; }\n  [data-sec=\"compare\"]    { order:7; }\n  [data-sec=\"testimonials\"]{ order:8; }\n  [data-sec=\"pricing\"]    { order:9; }\n  [data-sec=\"faq\"]        { order:10; }\n  [data-sec=\"cta\"]        { order:11; }\n  [data-sec=\"footer\"]     { order:12; }\n\n  /* ── Padding con más respiro entre secciones ── */\n  [data-sec=\"pain\"],\n  [data-sec=\"product\"],\n  [data-sec=\"para-quien\"],\n  [data-sec=\"compare\"],\n  [data-sec=\"testimonials\"],\n  [data-sec=\"pricing\"],\n  [data-sec=\"faq\"]        { padding:48px 20px !important; }\n  [data-sec=\"cta\"]        { padding:56px 20px !important; }\n  [data-sec=\"stats\"]      { padding:0 20px 12px !important; }\n  [data-sec=\"logos\"]      { padding:10px 0 !important; }\n\n  /* ── Testimonios más legibles ── */\n  .testi-q{ font-size:14px !important; }\n\n  /* ── Scroll-reveal fade-up para secciones ── */\n  [data-sec=\"pain\"],\n  [data-sec=\"product\"],\n  [data-sec=\"logos\"],\n  [data-sec=\"stats\"],\n  [data-sec=\"para-quien\"],\n  [data-sec=\"compare\"],\n  [data-sec=\"testimonials\"],\n  [data-sec=\"pricing\"],\n  [data-sec=\"faq\"],\n  [data-sec=\"cta\"]{\n    opacity:0;\n    transform:translateY(28px);\n    transition:opacity .6s cubic-bezier(.22,.6,.36,1), transform .6s cubic-bezier(.22,.6,.36,1);\n  }\n  [data-sec].sec-visible{\n    opacity:1 !important;\n    transform:translateY(0) !important;\n  }\n\n  /* ── Stagger: título, subtítulo y contenido entran en cascada ── */\n  [data-sec].sec-visible .sec-tag{ animation:fadeSlideUp .5s cubic-bezier(.22,.6,.36,1) .05s both; }\n  [data-sec].sec-visible .sec-h  { animation:fadeSlideUp .5s cubic-bezier(.22,.6,.36,1) .15s both; }\n  [data-sec].sec-visible .sec-p  { animation:fadeSlideUp .5s cubic-bezier(.22,.6,.36,1) .25s both; }\n\n  @keyframes fadeSlideUp{\n    from{ opacity:0; transform:translateY(16px); }\n    to  { opacity:1; transform:translateY(0); }\n  }\n\n  /* ── Línea lima del sec-tag crece al entrar ── */\n  [data-sec] .sec-tag::before{\n    width:0;\n    transition:width .5s cubic-bezier(.22,.6,.36,1) .1s;\n  }\n  [data-sec].sec-visible .sec-tag::before{ width:14px; }\n\n  /* ── Cards escalonadas: pain-cells ── */\n  [data-sec=\"pain\"].sec-visible .pain-cell:nth-child(1){ animation:fadeSlideUp .5s cubic-bezier(.22,.6, cubic-bezier(.22,.6,.36,1) .33s both; }\n\n  /* ── Títulos de sección más compactos ── */\n  .sec-h{ font-size:28px !important; margin-bottom:16px !important; }\n  .sec-p{ margin-bottom:28px !important; font-size:15px !important; }\n\n  /* ── Pain grid más legible ── */\n  .pain-q{ font-size:14px !important; margin-bottom:6px !important; }\n  .pain-a{ font-size:13px !important; padding-top:8px !important; }\n\n  /* ── Compare: ocultar en móvil (muy denso, ya está el hero) ── */\n  [data-sec=\"compare\"] .cmp{ font-size:11.5px !important; }\n\n  /* ── Testimonials: mostrar solo 2 ── */\n  .testi-card:nth-child(n+3){ display:none !important; }\n\n  /* ── Contador compacto en móvil ── */\n  .cd-box i{ font-size:17px !important; }\n  .plan-cd .cd-box i{ font-size:15px !important; }\n\n  /* ── FAQ legible ── */\n  .faq-layout{ grid-template-columns:1fr !important; gap:20px !important; }\n  .faq-q{ font-size:15px !important; padding:16px 0 !important; }\n  .faq-a{ font-size:15px !important; }\n  .plan-feats{ gap:11px !important; }\n\n  /* ── CTA final compacto ── */\n  .cta-title{ font-size:28px !important; }\n  .cta-sub{ font-size:15px !important; margin-bottom:20px !important; }\n\n  /* ── Hero espaciado móvil calibrado ── */\n  .hero{ padding: 36px 20px 40px !important; border-bottom: none !important; border-top: none !important; }\n  /* ── Sin línea gris entre hero y banner founders ── */\n  .stats-bar{ border: none !important; outline: none !important; box-shadow: none !important; margin-top: 0 !important; }\n  section.hero, .hero{ border-bottom: none !important; border-top: none !important; }\n  .hero-eyebrow{ margin-bottom: 12px !important; }\n  h1.hero-title{ margin-bottom: 12px !important; font-size: 30px !important; line-height: 1.1 !important; }\n  .hero-sub{ font-size: 15px !important; line-height: 1.65 !important; margin-bottom: 0 !important; }\n  .hero-actions{ margin-bottom: 0 !important; }\n  .proof-n{ font-size: 20px !important; }\n\n\n  /* ── Pricing: carrusel horizontal en móvil ── */\n  #plans-grid-main{\n    display:flex !important;\n    flex-direction:row !important;\n    overflow-x:auto !important;\n    scroll-snap-type:x mandatory !important;\n    -webkit-overflow-scrolling:touch !important;\n    gap:12px !important;\n    padding:0 20px 12px 20px !important;\n    margin:0 -20px !important;\n    scrollbar-width:none !important;\n    grid-template-columns:unset !important;\n    max-width:unset !important;\n    background:none !important;\n    border-radius:0 !important;\n  }\n  #plans-grid-main::-webkit-scrollbar{ display:none !important; }\n  #plans-grid-main .plan,\n  #plans-grid-main .plan.best{\n    flex:0 0 85vw !important;\n    scroll-snap-align:start !important;\n    width:85vw !important;\n    display:flex !important;\n    flex-direction:column !important;\n    min-width:0 !important;\n  }\n  /* Reactiva la card regular en móvil para el carrusel */\n  .plan.reveal.d2{ display:flex !important; }\n  /* Hint de swipe */\n  .plans-swipe-hint{\n    display:flex !important;\n    align-items:center;\n    gap:6px;\n    justify-content:center;\n    margin-top:8px;\n    font-size:10px;\n    color:var(--t4);\n    letter-spacing:.04em;\n  }\n  .plans-swipe-hint-dot{\n    width:18px;height:4px;border-radius:2px;background:var(--lime);\n  }\n  .plans-swipe-hint-dot2{\n    width:10px;height:4px;border-radius:2px;background:var(--border);\n  }\n  .mobile-off-badge{\n    display:inline-flex !important;\n    background:var(--lime);\n    color:#000;\n    font-size:9px;font-weight:800;\n    letter-spacing:.06em;\n    padding:3px 8px;\n    border-radius:var(--r-pill);\n    margin-left:4px;\n  }\n  .mobile-price-was{\n    display:inline !important;\n    font-size:18px;font-weight:500;\n    color:var(--t4);\n    text-decoration:line-through;\n    letter-spacing:-.02em;\n  }\n  .mobile-savings{\n    display:block !important;\n    font-size:12px;font-weight:600;\n    color:var(--lime-text);\n    margin-bottom:4px;\n    letter-spacing:-.01em;\n  }\n\n  /* ── Pill Solo Founders ── */\n  .founders-pill{\n    display:inline-flex;\n    align-items:center;\n    background:var(--lime-bg);\n    border:0.5px solid var(--lime-bdr);\n    color:var(--lime-text);\n    font-size:9px;font-weight:700;\n    letter-spacing:.06em;text-transform:uppercase;\n    padding:2px 7px;border-radius:var(--r-pill);\n    margin-left:6px;vertical-align:middle;\n  }\n\n  /* ── Precio tachado ── */\n  .price-was{\n    font-size:13px;color:var(--t4);\n    text-decoration:line-through;\n    margin-left:6px;font-weight:400;\n  }\n  .pricing-title-desktop{ display:none !important; }\n  .pricing-title-mobile{ display:block !important; }\n\n  /* ── Para quién acordeón ── */\n  .pq-body p      { font-size: 14px !important; }\n\n  /* ── Hero: orden y espaciado entre bloques con gap uniforme ── */\n  .hero-inner > div:first-child {\n    display: flex !important;\n    flex-direction: column !important;\n    gap: 16px !important;\n  }\n  .hero-eyebrow    { align-self: flex-start; margin-bottom: 0 !important; }\n  .eyebrow-desktop { display: none !important; }\n  .eyebrow-mobile  { display: inline !important; }\n  .hero-sub        { order: 3; }\n  .hero-proof      { order: 5; margin: 0 !important; margin-top: 4px !important; }\n  /* ── Ocultar botón Unirme en testimonios ── */\n  .testi-unirme{ display:none !important; }\n\n  /* ── Ocultar botones hero en móvil ── */\n  .hero-actions{ display:none !important; }\n  #problema, #producto { scroll-margin-top: 60px; }\n  .prod-mobile-feats  { display: none !important; }\n  .carousel-hint      { display: none !important; }\n  /* ── Para quién: alinear título a la izquierda en móvil ── */\n  .para-quien-sec div[style*=\"text-align:center\"] { text-align: left !important; }\n  .para-quien-sec .sec-tag { justify-content: flex-start !important; }\n  .para-quien-sec .sec-h   { text-align: left !important; }\n  /* ── Hero buttons: ambos gris, destello lima al tocar ── */\n  .hero-actions .btn-lime {\n    background: none !important;\n    color: var(--t2) !important;\n    border: 0.5px solid var(--border) !important;\n  }\n  .hero-actions .btn-lime:active,\n  .hero-actions .btn-ghost:active {\n    background: var(--lime) !important;\n    color: #000 !important;\n    border-color:var(--lime-text) !important;\n    opacity: 1 !important;\n  }\n  /* mockup reposicionado por JS con order:4, con más aire */\n  #hero-mockup-anim{ margin-top: 8px !important; width: 100% !important; }\n\n  /* ── Footer móvil ── */\n  .f-barranquilla    { display: none !important; }\n  .f-col-plataforma  { display: none !important; }\n  .f-link-soporte    { display: none !important; }\n  #prod-mobile-anim-new .hero-mockup-prod {\n    transition: box-shadow 0.6s ease, border-color 0.6s ease;\n  }\n  #prod-mobile-anim-new.in-view .hero-mockup-prod {\n    border-color: rgba(173,220,0,.35) !important;\n    box-shadow: 0 0 0 1px rgba(173,220,0,.12), 0 16px 48px rgba(0,0,0,.7) !important;\n  }\n\n  /* ── Logos strip: pills en grilla en móvil ── */\n  .logos-strip{ padding:20px 20px !important; border-bottom:0.5px solid var(--sep) !important; }\n  .logos-inner{ display:block !important; padding:0 !important; max-width:100% !important; }\n  .strip-label{ display:block !important; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--t4); margin-bottom:12px; padding:0; border:none; margin-right:0; }\n  .logos-row{ display:none !important; }\n  .logos-ticker-wrap{ display:none !important; }\n  .logos-pills{ display:flex !important; flex-wrap:wrap; gap:7px; }\n  .logos-pill{\n    font-size:11px; font-weight:700;\n    color:var(--t3);\n    letter-spacing:.06em;\n    text-transform:uppercase;\n    padding:5px 10px;\n    border-radius:var(--r-pill);\n    background:var(--bg-card);\n    border:0.5px solid var(--border-hi);\n  }\n\n  /* ── Animación pipeline móvil ── */\n  .pipe-anim-mobile{ display:block !important; }\n  .pam-label{ font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-bottom:12px;text-align:center; }\n  .pam-docs{ display:flex;gap:8px;justify-content:center;margin-bottom:0; }\n  .pam-doc{ flex:1;max-width:96px;background:var(--bg-card);border:0.5px solid var(--border);border-radius:6px;padding:8px 10px;opacity:0;transform:translateY(-8px);transition:all .5s ease; }\n  .pam-doc.pam-vis{ opacity:1;transform:translateY(0); }\n  .pam-tag{ font-size:8px;font-weight:700;padding:1px 6px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase;display:inline-block;margin-bottom:4px; }\n  .pam-lang{ font-size:9px;color:var(--t4);margin-bottom:4px;font-weight:500; }\n  .pam-lines{ display:flex;flex-direction:column;gap:3px; }\n  .pam-line{ height:3px;border-radius:2px;background:var(--sep); }\n  .pam-funnel{ display:flex;justify-content:center;height:44px; }\n  .pam-result{ background:var(--bg-card);border:1px solid rgba(173,220,0,.25);border-radius:var(--r-md);padding:12px 14px;opacity:0;transform:translateY(8px);transition:all .7s ease;max-width:220px;margin:0 auto; }\n  .pam-result.pam-vis{ opacity:1;transform:translateY(0); }\n  .pam-result-header{ display:flex;align-items:center;gap:6px;margin-bottom:8px; }\n  .pam-result-dot{ width:5px;height:5px;border-radius:50%;background:var(--lime);animation:pulse 2s ease-in-out infinite;flex-shrink:0; }\n  .pam-result-title{ font-size:10px;font-weight:700;color:var(--lime-text);letter-spacing:.06em;text-transform:uppercase; }\n  .pam-result-lines{ display:flex;flex-direction:column;gap:4px; }\n  .pam-result-line{ height:4px;border-radius:2px;background:var(--sep); }\n  .pam-result-line.hl{ background:rgba(173,220,0,.3); }\n  .pam-sources{ font-size:9px;color:var(--t4);margin-top:8px;letter-spacing:.03em; }\n  .pam-sources span{ color:var(--lime-text); }\n\n  /* ── Ver más — pain grid ── */\n  .pain-ver-mas{\n    display:block;\n    width:100%;\n    margin-top:12px;\n    padding:12px;\n    background:none;\n    border:0.5px solid var(--border-hi);\n    border-radius:var(--r-md);\n    color:var(--t2);\n    font-family:var(--font);\n    font-size:13px;\n    font-weight:500;\n    cursor:pointer;\n    letter-spacing:.01em;\n    transition:all .2s ease;\n  }\n  .pain-ver-mas:active{\n    background:var(--bg-card);\n    color:var(--lime-text);\n    border-color:var(--lime-bdr);\n  }\n\n  /* ── Línea divisora verde lima — eliminada ── */\n\n  /* ── Fix pill \"Solo Founders\" — desktop only ── */\n  .founders-pill {\n    white-space: nowrap !important;\n    flex-shrink: 0 !important;\n  }\n\n}\n\n\n/* ── ENCABEZADO (banner + nav) DE LA VERSIÓN A ── */\n:root{ --max:1120px; }\n.banner{background:var(--lime);color:#000;font-size:13px;font-weight:600;text-align:center;\n  padding:9px 16px;letter-spacing:-.005em;position:relative;z-index:210}\n.banner b{font-family:var(--mono);font-weight:500;background:rgba(0,0,0,.14);\n  padding:2px 7px;border-radius:5px;margin-left:4px}\n.head{position:sticky;top:0;z-index:200;background:rgba(0,0,0,.9);\n  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--sep)}\n.head-in{max-width:1168px;margin:0 auto;padding:0 24px;height:56px;\n  display:flex;align-items:center;gap:26px}\n.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}\n.logo-mark{background:var(--lime);color:#000;font-family:var(--mono);font-size:11px;font-weight:500;\n  padding:4px 7px;border-radius:5px;line-height:1;letter-spacing:.03em}\n.logo-name{font-size:13.5px;font-weight:600;letter-spacing:-.015em;color:var(--t1)}\n.head .nav{flex:1;display:flex;gap:22px;list-style:none}\n.head .nav a{color:var(--t3);font-size:13.5px;transition:.15s}\n.head .nav a:hover{color:var(--t1)}\n.head-act{display:flex;align-items:center;gap:9px;flex-shrink:0}\n.link-ghost{font-size:13.5px;color:var(--t2)}\n.link-ghost:hover{color:var(--lime-text)}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;\n  font-size:15px;font-weight:600;padding:14px 26px;border-radius:var(--r-pill);\n  border:1px solid transparent;cursor:pointer;transition:.16s;white-space:nowrap;line-height:1.2}\n.btn-p{background:var(--lime);color:#000}\n.btn-p:hover{background:#c2f200;transform:translateY(-1px)}\n.btn-sm{font-size:13px;padding:9px 18px}\n@media(max-width:900px){.head .nav{display:none}}\n@media(max-width:520px){.link-ghost{display:none}.banner{font-size:11.5px;padding:8px 12px}}\n\n/* ── AJUSTES TOMADOS DE LA VERSIÓN A ── */\n/* PALETA COMPLETA DE LA VERSIÓN A, aplicada a toda la landing */\n:root{\n  --bg:#000; --bg-card:#0e0e0e; --bg-card2:#141414; --bg-hover:#181818;\n  --border:#232323; --border-hi:#2e2e2e; --sep:#1a1a1a;\n  --t1:#f5f5f5; --t2:#9a9a9f; --t3:#6c6c70; --t4:#48484c;\n  --lime:#addc00; --lime-text:#addc00; --lime-d:#8db400; --lime-bg:rgba(173,220,0,.09); --lime-bdr:rgba(173,220,0,.22);\n  --red:#e2484f; --amber:#e0a800; --blue:#4d9be6; --violet:#8b7fe0;\n  --teal:#23a48a; --pink:#d76bb0; --purple:#a06ee0;\n  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;\n}\nh1.hero-title{ font-weight:600; letter-spacing:-.035em; }\n.hero-sub{ color:var(--t2); }\n.hero-sub strong{ color:var(--t1); font-weight:500; }\n/* stats: en A los números van en BLANCO, no en lima, y la etiqueta más legible */\n.proof-n{ color:var(--t1) !important; }\n.proof-l{ color:var(--t3) !important; text-transform:none !important; letter-spacing:.02em !important; font-size:11.5px !important; }\n/* eyebrow en tipografía mono, como el pill de A */\n.hero-eyebrow{ font-family:var(--mono); font-weight:400; letter-spacing:.08em; }\n\n\n/* ── BLOQUE PROBLEMA — estética exacta de la versión A ── */\n.pA{padding:88px 0;border-top:1px solid var(--sep);border-bottom:none}\n.pA .wrap{max-width:1168px;margin:0 auto;padding:0 24px}\n.pA .sec-narrow{max-width:760px;margin:0}\n.pA .sec-narrow.center{margin:0 auto}\n.pA .center{text-align:center}\n.pA .center .lead{margin-left:auto;margin-right:auto}\n.pA .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--lime-text);margin-bottom:14px}\n.pA h2{font-size:clamp(26px,3.4vw,40px);font-weight:600;letter-spacing:-.025em;line-height:1.12;\n  color:var(--t1);margin-bottom:16px}\n.pA .lead{color:var(--t2);font-size:17px;line-height:1.65;max-width:660px}\n.pA .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.pA .card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px;transition:.18s}\n.pA .card:hover{border-color:var(--border-hi);background:var(--bg-card2)}\n.pA .card h3{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.12;\n  color:var(--t1);margin-bottom:8px}\n.pA .card p{font-size:15px;color:var(--t2);line-height:1.6}\n.pA .card .num{font-family:var(--mono);font-size:11px;color:var(--lime-text);margin-bottom:12px;display:block}\n.pA .cite{font-family:var(--mono);font-size:10px;color:var(--lime-d);letter-spacing:.02em;white-space:nowrap}\n.pA .disc{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--pink);\n  border:1px solid rgba(215,107,176,.4);background:rgba(215,107,176,.09);padding:1px 6px;border-radius:4px}\n/* Etiqueta «basado en la experiencia»: marca en línea, sin caja —\n   el color va como trazo (icono + subrayado), no como relleno. */\n.pA .disc.exp{\n  display:inline;font-family:inherit;font-size:inherit;letter-spacing:0;\n  padding:0;border:none;background:none;border-radius:0;\n  color:#1b6aa8;font-weight:500;\n  text-decoration:underline;text-decoration-thickness:1px;\n  text-decoration-color:rgba(27,106,168,.38);text-underline-offset:3px;\n}\n.pA .disc.exp svg{\n  width:1em;height:1em;margin-right:.32em;vertical-align:-.14em;\n  flex:none;fill:none;stroke:currentColor;stroke-width:2;\n  stroke-linecap:round;stroke-linejoin:round;opacity:.85;\n}\n.pA:not(.light) .disc.exp{color:#7fb2e0;text-decoration-color:rgba(127,178,224,.4)}\n.pA .link-ghost{font-size:13.5px;color:var(--lime-text)}\n.pA .link-ghost:hover{text-decoration:underline}\n.pA .card-cta{border-color:var(--lime-bdr);\n  background:linear-gradient(180deg,rgba(173,220,0,.06),transparent)}\n.pA .card-cta .num{color:var(--lime-text)}\n@media(max-width:900px){.pA .g3{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:620px){.pA .g3{grid-template-columns:1fr}.pA{padding:56px 0}.pA .wrap{padding:0 18px}}\n/* ══ COMPARATIVA — tabla (CSS que faltaba de la versión A) ══ */\n.mut2{color:var(--t3)}\n.cmp-wrap{\n  max-width:1120px;\n  border:1px solid var(--border);\n  border-radius:var(--r-lg);\n  background:var(--bg-card);\n  overflow-x:auto;\n  -webkit-overflow-scrolling:touch;\n  box-shadow:0 22px 60px -32px rgba(0,0,0,.9);\n}\n.cmp{\n  width:100%;\n  border-collapse:separate;\n  border-spacing:0;\n  font-size:13px;\n  --ok:#25c46f;   --ok-bg:rgba(37,196,111,.15);\n  --mid:#e0a800;  --mid-bg:rgba(224,168,0,.15);\n  --nope:#e2484f; --nope-bg:rgba(226,72,79,.14);\n}\n.cmp th,.cmp td{\n  text-align:center;\n  vertical-align:middle;\n  line-height:1.35;\n  border-bottom:1px solid var(--sep);\n  padding:8px 12px;\n}\n.cmp tbody tr:last-child td:not(.hi),\n.cmp tbody tr:last-child th{border-bottom:none}\n.cmp thead th:not(:first-child),\n.cmp tbody td:not(:first-child){min-width:96px}\n\n/* Encabezado */\n.cmp thead th{\n  font-family:var(--mono);\n  font-size:10.5px;\n  font-weight:500;\n  letter-spacing:.09em;\n  text-transform:uppercase;\n  color:var(--t3);\n  background:#0a0a0a;\n  padding-top:12px;padding-bottom:11px;\n  white-space:nowrap;\n  vertical-align:bottom;\n  border-bottom:1px solid var(--border);\n}\n.cmp .cmp-n{display:block;font-family:var(--font);font-size:12px;font-weight:500;\n  letter-spacing:0;text-transform:none;color:var(--t3);line-height:1.25}\n.cmp .cmp-e{display:block;font-family:var(--font);font-size:9px;letter-spacing:0;\n  text-transform:none;color:var(--t4);font-weight:400;line-height:1.25;margin-top:2px;\n  white-space:normal;max-width:150px;margin-left:auto;margin-right:auto}\n\n/* Primera columna */\n.cmp thead th:first-child,\n.cmp tbody th,\n.cmp tfoot th{\n  position:sticky;left:0;\n  background:#0a0a0a;\n  border-right:1px solid var(--sep);\n  min-width:168px;\n  text-align:left;\n}\n.cmp thead th:first-child{z-index:3}\n.cmp tbody th{\n  z-index:2;color:var(--t1);font-weight:500;font-size:12px;\n  line-height:1.3;font-family:var(--font);text-transform:none;letter-spacing:0;\n}\n.cmp tbody td{background:var(--bg-card)}\n.cmp tbody tr:nth-child(even) td:not(.hi){background:#131313}\n.cmp tbody tr:hover td:not(.hi){background:var(--bg-hover)}\n.cmp tbody tr:hover th{background:#141414}\n\n/* Fichas circulares */\n.cmp .chip{\n  display:inline-flex;align-items:center;justify-content:center;\n  width:23px;height:23px;border-radius:50%;\n  vertical-align:middle;flex:none;\n}\n.cmp .mk{width:13px;height:13px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}\n.cmp .c-y{background:var(--ok-bg)}   .cmp .c-y .mk{stroke:var(--ok)}\n.cmp .c-p{background:var(--mid-bg)}  .cmp .c-p .mk{stroke:var(--mid)}\n.cmp .c-n{background:var(--nope-bg)} .cmp .c-n .mk{stroke:var(--nope);width:14px}\n.cmp .cnote{display:block;font-size:10px;color:var(--t3);margin-top:3px;line-height:1.2}\n.cmp .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n.cmp .cval{display:block;font-size:12px;color:var(--t2);line-height:1.35}\n.cmp .rnote{display:table;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;\n  text-transform:uppercase;color:var(--t4);border:1px solid var(--sep);border-radius:4px;\n  padding:1px 5px;margin:5px 0 0}\n.cmp-src{font-size:11.5px;line-height:1.6;margin-top:16px;max-width:1120px}\n.cmp-src b{color:var(--t2);font-weight:500}\n\n/* ── Columna Clinical Hub: elevada, borde y cabecera lima ── */\n.cmp .hi{\n  background:var(--lime-bg);\n  border-left:2px solid var(--lime);\n  border-right:2px solid var(--lime);\n}\n.cmp thead th.hi{\n  background:var(
