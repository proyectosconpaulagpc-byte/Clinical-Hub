cos, choques y…<\u002Fp>\n              <div class=\"cg-axes--card\"><span class=\"cg-axis\">AHA 2025<\u002Fspan><span class=\"cg-axis\">ERC 2025<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"cg-card-foot\">\n              <span class=\"cg-cf cg-cf--am\"><svg sc-camel-view-box=\"0 0 22 20\"><circle cx=\"11\" cy=\"3.4\" r=\"2.4\"><\u002Fcircle><path d=\"M11 5.8v3.4M4.5 9.2h13M4.5 9.2v4.2M17.5 9.2v4.2\"><\u002Fpath><circle cx=\"4.5\" cy=\"15.8\" r=\"2.4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"15.8\" r=\"2.4\"><\u002Fcircle><\u002Fsvg><span>Algoritmo maestro<\u002Fspan><\u002Fspan>\n              <span class=\"cg-cf-div\"><\u002Fspan>\n              <span class=\"cg-cf\"><svg sc-camel-view-box=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><span>Panel completo<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n        <p class=\"sg-cap\" style=\"margin:18px 20px 0\">Cada ficha adelanta las preguntas que resuelve y de qué guías salió, antes de abrirla. Dos entradas: la vía rápida o el panel completo.<\u002Fp>\n      <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ── PANEL DE PREGUNTAS ── -->\n      <div class=\"vp\" id=\"vp-preg\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">02<\u002Fspan>\n          <h3>La pregunta que ya tenías <em>en la cabeza<\u002Fem><\u002Fh3>\n          <p>Un PDF te obliga a saber en qué sección está la respuesta. Aquí navegas por fase del procedimiento y, dentro, por la duda tal como te la haces en el turno.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Panel de la guía · Secuencia de intubación rápida<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-preg\" data-theme=\"light\">\n        <div class=\"mast\">\n          <div class=\"mast-h\">Secuencia de intubación rápida <span class=\"sigla\">(<abbr class=\"gt\" data-s=\"ISR\" data-e=\"Secuencia de Intubación Rápida\" data-d=\"Técnica de intubación en la que inductor y relajante se administran casi simultáneamente, sin ventilar entre medias.\">ISR<\u002Fabbr>)<\u002Fspan><\u002Fdiv>\n          <div class=\"synth\">Síntesis de <b>5<\u002Fb> guías<\u002Fdiv>\n          <div class=\"srcline\">\n            <span class=\"srcpill\">SCCM 2023 · SIR paciente crítico<\u002Fspan>\n            <span class=\"srcpill\">DAS 2025 · vía aérea difícil<\u002Fspan>\n            <span class=\"srcpill\">CAFG 2021 · vía aérea difícil pte inconsciente<\u002Fspan>\n            <span class=\"srcpill\">SFAR 2017 · intubación UCI<\u002Fspan>\n            <span class=\"srcpill\">ESAIC 2022 · bloqueo NM<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"scope\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"flex:none\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16h.01\"><\u002Fpath><\u002Fsvg>Aplica solo a adultos. La versión completa en texto acompaña a este resumen.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mrule\"><\u002Fdiv>\n        <div class=\"wrapg\">\n          <div class=\"phead\"><h4>¿Qué necesitas resolver?<\u002Fh4><p>Síntesis de 5 guías. Elige la pregunta tal como te la haces en el turno.<\u002Fp><\u002Fdiv>\n          <div class=\"cgrid\">\n            <div class=\"cat master\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M8 6h13\"><\u002Fpath><path d=\"M8 12h13\"><\u002Fpath><path d=\"M8 18h13\"><\u002Fpath><path d=\"M3 6h.01\"><\u002Fpath><path d=\"M3 12h.01\"><\u002Fpath><path d=\"M3 18h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><span><span class=\"cat-t\">Manejo<\u002Fspan><span class=\"dist\">Algoritmo maestro<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cuál es el manejo, fase por fase?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M14.6 6.4a4 4 0 1 0 3 3l3.4-3.4-2-2-1.5 1.5-1.5-1.5 1.5-1.5-2-2z\"><\u002Fpath><path d=\"M11.6 9.4 3 18v3h3l8.6-8.6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">Herramientas a pie de cama<\u002Fspan><\u002Fdiv>\n              <span class=\"q\"><span class=\"qic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><\u002Fspan>Abrir el checklist pre-intubación<span class=\"toolbadge\">interactivo<\u002Fspan><\u002Fspan>\n              <span class=\"q\"><span class=\"qic\"><svg sc-camel-view-box=\"0 0 24 24\"><rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M8 6h8\"><\u002Fpath><path d=\"M8 10h.01\"><\u002Fpath><path d=\"M12 10h.01\"><\u002Fpath><path d=\"M16 10h.01\"><\u002Fpath><path d=\"M8 14h.01\"><\u002Fpath><path d=\"M12 14h.01\"><\u002Fpath><path d=\"M8 18h8\"><\u002Fpath><\u002Fsvg><\u002Fspan>Calcular dosis por peso<span class=\"toolbadge\">interactivo<\u002Fspan><\u002Fspan>\n              <span class=\"q\"><span class=\"qic\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l2.5 2.5\"><\u002Fpath><path d=\"M9 2h6\"><\u002Fpath><path d=\"M12 2v3\"><\u002Fpath><\u002Fsvg><\u002Fspan>Cronómetro de signos vitales + metrónomo RCP<span class=\"toolbadge\">interactivo<\u002Fspan><\u002Fspan>\n              <span class=\"q\">¿Qué <b>tamaños y profundidad<\u002Fb> uso (tubo, hoja, mascarilla)?<\u002Fspan>\n              <span class=\"q\">¿Qué <b>fármacos<\u002Fb> elijo según el escenario clínico?<\u002Fspan>\n              <span class=\"q\">¿Cómo <b>confirmo el tubo<\u002Fb> si no tengo capnografía?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20.5 20.5 16 16\"><\u002Fpath><path d=\"M11 8v6\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">1 · Predecir y decidir<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cómo predigo una vía aérea difícil? (<abbr class=\"gt\" data-s=\"MACOCHA\" data-e=\"Mallampati, Apnea, Cervical, Opening, Coma, Hypoxia, Anesthesiologist\" data-d=\"Escala que predice intubación difícil en el paciente crítico. ≥3 puntos = difícil.\">MACOCHA<\u002Fabbr>)<\u002Fspan>\n              <span class=\"q\">¿Y si el paciente tiene obesidad?<\u002Fspan>\n              <span class=\"q\">¿Qué calibre de tubo, hoja, mascarilla y profundidad?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M2 11h4l2-4 3 8 2-5 2 1h5\"><\u002Fpath><path d=\"M8 21h8\"><\u002Fpath><path d=\"M12 17v4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">2 · Preparar y optimizar<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cómo optimizo al paciente y al equipo antes de inducir?<\u002Fspan>\n              <span class=\"q\">¿Qué monitorización y paraclínicos pido?<\u002Fspan>\n              <span class=\"q\">¿En qué posición coloco al paciente?<\u002Fspan>\n              <span class=\"q\">¿Debo descomprimir el estómago (SNG)?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M3 8h11a3 3 0 1 0-3-3\"><\u002Fpath><path d=\"M3 16h13a3 3 0 1 1-3 3\"><\u002Fpath><path d=\"M3 12h17\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">3 · Preoxigenar<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cómo preoxigeno?<\u002Fspan>\n              <span class=\"q\">¿Cómo mantengo la oxigenación durante la apnea?<\u002Fspan>\n              <span class=\"q\">El paciente no colabora para preoxigenar, ¿qué hago?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M10.5 20.5 20.5 10.5a5 5 0 0 0-7-7l-10 10a5 5 0 0 0 7 7Z\"><\u002Fpath><path d=\"m8.5 8.5 7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">4 · Inducir y paralizar<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Debo premedicar (fentanilo, atropina, lidocaína)?<\u002Fspan>\n              <span class=\"q\">Las dos reglas de oro (inductor + <abbr class=\"gt\" data-s=\"BNM\" data-e=\"Bloqueante NeuroMuscular\" data-d=\"Fármaco relajante muscular: succinilcolina o rocuronio.\">BNM<\u002Fabbr>)<\u002Fspan>\n              <span class=\"q\">¿Qué inductor elijo?<\u002Fspan>\n              <span class=\"q\">¿Succinilcolina o rocuronio? (discrepancia)<\u002Fspan>\n              <span class=\"q\">¿Cómo revierto con sugammadex?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M3 12h11\"><\u002Fpath><path d=\"M11 7l5 5-5 5\"><\u002Fpath><path d=\"M19 5v14\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">5 · Intubar y confirmar<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cómo mejoro el paso del tubo? (técnica práctica)<\u002Fspan>\n              <span class=\"q\">¿Uso presión cricoidea (Sellick)?<\u002Fspan>\n              <span class=\"q\">¿Cuántos intentos antes de declarar fallo?<\u002Fspan>\n              <span class=\"q\">¿Cómo confirmo el tubo sin capnografía?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">Rescate — vía aérea fallida<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Cuál es el algoritmo A→B→C→D?<\u002Fspan>\n              <span class=\"q\">¿Cómo hago la <abbr class=\"gt\" data-s=\"eFONA\" data-e=\"emergency Front Of Neck Access\" data-d=\"Acceso frontal del cuello de emergencia: la cricotirotomía.\">eFONA<\u002Fabbr> (cricotirotomía)?<\u002Fspan>\n              <span class=\"q\">¿Qué significan CICO y CVCO?<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cat\">\n              <div class=\"cat-h\"><span class=\"ic\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M20.42 4.58a5.4 5.4 0 0 0-7.65 0L12 5.35l-.77-.77a5.4 5.4 0 0 0-7.65 7.65L12 21l8.42-8.77a5.4 5.4 0 0 0 0-7.65Z\"><\u002Fpath><path d=\"M3.5 12h4l2-4 3 8 2-4h4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cat-t\">Paciente en paro<\u002Fspan><\u002Fdiv>\n              <span class=\"q\">¿Por qué el paro no es una <abbr class=\"gt\" data-s=\"ISR\" data-e=\"Secuencia de Intubación Rápida\" data-d=\"Técnica de intubación en la que inductor y relajante se administran casi simultáneamente, sin ventilar entre medias.\">ISR<\u002Fabbr>?<\u002Fspan>\n              <span class=\"q\">Capnografía de onda durante el paro<\u002Fspan>\n              <span class=\"q\">¿Transiciones por tiempo o por intentos?<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ── ALGORITMO MAESTRO ── -->\n      <div class=\"vp\" id=\"vp-algo\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">03<\u002Fspan>\n          <h3>Un algoritmo maestro, <em>tejido de varias guías<\u002Fem><\u002Fh3>\n          <p>Cinco sociedades no dicen lo mismo ni se leen igual. Las reconciliamos en <b>una sola vía, fase por fase<\u002Fb>, y en cada nodo señalamos de qué guía salió ese paso.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Algoritmo maestro · ISR del adulto<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-algo\" data-theme=\"light\">\n        <div class=\"wrapg\">\n          <div class=\"phead\"><h4>Algoritmo maestro — <abbr class=\"gt\" data-s=\"ISR\" data-e=\"Secuencia de Intubación Rápida\" data-d=\"Técnica de intubación en la que inductor y relajante se administran casi simultáneamente, sin ventilar entre medias.\">ISR<\u002Fabbr> del adulto<\u002Fh4><p>La vía rápida: cinco pasos, cada afirmación con su fuente y su página.<\u002Fp><\u002Fdiv>\n          <div class=\"algo\">\n            <div class=\"flow\">\n              <div class=\"stepbox\"><div><span class=\"sn\">1<\u002Fspan><span class=\"st\">Preparación y predicción<\u002Fspan><\u002Fdiv><div class=\"sd\">Todo paciente crítico se asume de intubación complicada. Puedes predecir el éxito con <b><abbr class=\"gt\" data-s=\"MACOCHA\" data-e=\"Mallampati, Apnea, Cervical, Opening, Coma, Hypoxia, Anesthesiologist\" data-d=\"Escala que predice intubación difícil en el paciente crítico. ≥3 puntos = difícil.\">MACOCHA<\u002Fabbr><\u002Fb> (≥3 = difícil) <span class=\"cit\">SFAR T2<\u002Fspan>. Verificar capnografía y SpO₂ audible antes de inducir <span class=\"cit\">DAS · p287<\u002Fspan>. Carro de paro + carro de vía aérea difícil + kit de <abbr class=\"gt\" data-s=\"eFONA\" data-e=\"emergency Front Of Neck Access\" data-d=\"Acceso frontal del cuello de emergencia: la cricotirotomía.\">eFONA<\u002Fabbr> accesibles <span class=\"cit\">SFAR R2.2<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n              <div class=\"conn\"><\u002Fdiv>\n              <div class=\"stepbox\"><div><span class=\"sn\">2<\u002Fspan><span class=\"st\">Posición + preoxigenación<\u002Fspan><\u002Fdiv><div class=\"sd\">Posición <b>semi-Fowler / cabecera elevada<\u002Fb> <span class=\"cit\">SCCM Q1<\u002Fspan>. Preoxigenar con presión positiva: <b><abbr class=\"gt\" data-s=\"VNI\" data-e=\"Ventilación No Invasiva\" data-d=\"Soporte ventilatorio con presión positiva a través de mascarilla, sin tubo endotraqueal.\">VNI<\u002Fabbr><\u002Fb> si hipoxemia grave (PaO₂/FiO₂&lt;150) <span class=\"cit\">SCCM Q2 · SFAR R4.1<\u002Fspan>; <b><abbr class=\"gt\" data-s=\"CNAF\" data-e=\"Cánula Nasal de Alto Flujo\" data-d=\"Oxígeno humidificado y calentado a flujos de 40–70 L/min por cánula nasal.\">CNAF<\u002Fabbr><\u002Fb> si se espera laringoscopia difícil <span class=\"cit\">SCCM Q2<\u002Fspan>. Oxigenación apneica con cánula nasal 5–15 L/min <span class=\"cit\">CAFG §7 · p1381<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n              <div class=\"conn\"><\u002Fdiv>\n              <div class=\"stepbox\"><div><span class=\"sn\">3<\u002Fspan><span class=\"st\">Inducción + <abbr class=\"gt\" data-s=\"BNM\" data-e=\"Bloqueante NeuroMuscular\" data-d=\"Fármaco relajante muscular: succinilcolina o rocuronio.\">BNM<\u002Fabbr> (sucesión rápida)<\u002Fspan><\u002Fdiv><div class=\"sd\">Optimizar la hemodinamia periintubación (líquidos / vasopresores precoces) <span class=\"cit\">SFAR R4.6<\u002Fspan>. Administrar <b>siempre<\u002Fb> un sedante-hipnótico cuando se usa BNM <span class=\"cit\">SCCM Q6<\u002Fspan> y <b>siempre<\u002Fb> BNM cuando se usa inductor <span class=\"badge b-strong\">Fuerte<\u002Fspan> <span class=\"cit\">SCCM Q9<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n              <div class=\"conn\"><\u002Fdiv>\n              <div class=\"stepbox\"><div><span class=\"sn\">4<\u002Fspan><span class=\"st\">Laringoscopia — videolaringoscopio<\u002Fspan><\u002Fdiv><div class=\"sd\">Usar <b>videolaringoscopio de primera línea<\u002Fb> siempre que sea posible <span class=\"cit\">DAS · p288<\u002Fspan>. Con hoja hiperangulada, <b>usar<\u002Fb> estilete/bougie/broncoscopio <span class=\"cit\">DAS · p289<\u002Fspan>. Si mala visión: manipulación laríngea externa (<abbr class=\"gt\" data-s=\"BURP\" data-e=\"Backward, Upward, Rightward Pressure\" data-d=\"Manipulación laríngea externa que mejora la visión glótica.\">BURP<\u002Fabbr>) — no presión cricoidea (Sellick) <span class=\"cit\">DAS · p289 · CAFG T7<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n              <div class=\"conn dec\"><\u002Fdiv>\n              <div class=\"guard\"><b>Si hay hipoxemia en cualquier momento →<\u002Fb> abandonar el intento y priorizar oxigenación con mascarilla. Máximo <b>3 + 1 intentos<\u002Fb> (cada uno con un cambio que aumente el éxito: posición, laringoscopio, operador, introductor, <abbr class=\"gt\" data-s=\"BURP\" data-e=\"Backward, Upward, Rightward Pressure\" data-d=\"Manipulación laríngea externa que mejora la visión glótica.\">BURP<\u002Fabbr>, optimizar BNM); tras ello, declarar fallo y pasar al algoritmo de vía aérea fallida. <span class=\"cit w\">DAS · p289 · CAFG §7 · p1385<\u002Fspan><\u002Fdiv>\n              <div class=\"conn dec\"><\u002Fdiv>\n              <div class=\"stepbox\"><div><span class=\"sn\">5<\u002Fspan><span class=\"st\">Confirmación — capnografía de onda<\u002Fspan><\u002Fdiv><div class=\"sd\"><b>Verificación ideal con dos puntos<\u002Fb>: visualización del tubo cruzando las cuerdas + capnografía de onda sostenida. Sin capnografía: visión directa + auscultación bilateral simétrica sin burbujeo epigástrico. Descartar selectividad bronquial con auscultación y radiografía de tórax.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"srcfoot\"><b>Fuentes:<\u002Fb> SCCM 2023 · DAS 2025 · CAFG 2021 · SFAR 2017 · ESAIC 2022. Cada nodo enlaza al documento original en la sección y página citadas.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ── HERRAMIENTAS ── -->\n            <div class=\"vp\" id=\"vp-ref\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">04<\u002Fspan>\n          <h3>Todo referenciado, <em>hasta la página<\u002Fem><\u002Fh3>\n          <p>No «según la literatura». Cada afirmación lleva <b>sociedad, año, sección y página<\u002Fb> — y cuando el dato no sale de una guía, también lo decimos. Es lo que te permite sustentar la conducta ante un comité o una historia clínica revisada.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Sistema de citación de Clinical Hub<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-ref\" data-theme=\"light\">\n            <div class=\"wrapg\">\n              <div class=\"phead\"><h4>Anatomía de una cita<\u002Fh4><p>Una sola afirmación, pieza por pieza. Todas en la plataforma se leen igual.<\u002Fp><\u002Fdiv>\n\n              <div class=\"rf-anat\">\n                <div class=\"rf-claim\">\n                  Angiografía &lt;24 h <span class=\"badge b-cond\">Condicional<\u002Fspan> <span class=\"cit\">ESC 2023 · RT4 · p3750<\u002Fspan>\n                <\u002Fdiv>\n\n                <div class=\"rf-diss\">\n                  <div class=\"rf-row\">\n                    <span class=\"badge b-cond\">Condicional<\u002Fspan>\n                    <div class=\"rf-txt\"><b>Cuánto pesa<\u002Fb>La guía lo sugiere, no lo impone. Aquí es donde casi todos hacen trampa: un resumen mezcla la recomendación firme, la sugerencia y el desacuerdo entre sociedades como si todo pesara igual. Cada afirmación lleva su etiqueta, y no todas valen lo mismo.\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"rf-row\">\n                    <span class=\"rf-tok\">ESC<\u002Fspan>\n                    <div class=\"rf-txt\"><b>Quién lo dice<\u002Fb>La sociedad que publica la guía — aquí, la European Society of Cardiology.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"rf-row\">\n                    <span class=\"rf-tok\">2023<\u002Fspan>\n                    <div class=\"rf-txt\"><b>Qué edición<\u002Fb>Las guías se actualizan. El año te dice si lo que estás leyendo sigue vigente.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"rf-row\">\n                    <span class=\"rf-tok\">RT4<\u002Fspan>\n                    <div class=\"rf-txt\"><b>Dónde exactamente<\u002Fb>Tabla de recomendaciones nº 4. Según el documento puede ser §&nbsp;sección o pregunta PICO.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"rf-row\">\n                    <span class=\"rf-tok\">p3750<\u002Fspan>\n                    <div class=\"rf-txt\"><b>La página del original<\u002Fb>Abres el PDF de la sociedad en esa página y lo compruebas. Eso es lo que nadie más te da.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp\" id=\"vp-tool\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">05<\u002Fspan>\n          <h3>No es un documento. Es algo que <em>ejecutas<\u002Fem><\u002Fh3>\n          <p>Calculadora de dosis por peso, checklist pre-intubación de DAS y cronómetro con alerta cada dos minutos. Las tres funcionan aquí mismo — pruébalas.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Herramientas a pie de cama · las tres son funcionales<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-tool\" data-theme=\"light\">\n        <div class=\"wrapg\">\n          <div class=\"phead\"><h4>Herramientas a pie de cama<\u002Fh4><p>Calculadora de dosis por peso, checklist pre-intubación y cronómetro de signos vitales. Pensado para uso a pie de cama — funcionan aquí mismo.<\u002Fp><\u002Fdiv>\n          <div class=\"tsec\" id=\"tp-calc\">\n            <div class=\"tsec-h\"><span class=\"tsec-n\">1<\u002Fspan>Dosis por peso<\u002Fdiv>\n            <div class=\"calc\">\n              <div class=\"calc-top\">\n                <label for=\"dvPeso\">Peso del paciente<\u002Flabel>\n                <input type=\"number\" id=\"dvPeso\" class=\"wkg\" placeholder=\"––\" min=\"0\" step=\"1\" sc-camel-input-mode=\"numeric\">\n                <span class=\"cu\">kg<\u002Fspan>\n                <span class=\"chint\">Introduce el peso → las dosis se calculan solas. Cada valor en mg/kg (o mcg/kg) es editable.<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"dgrp\"><div class=\"dgl\">Premedicación <em>· no rutinaria, solo si se considera<\u002Fem><\u002Fdiv>\n                <div class=\"drows\">\n                  <div class=\"dcard\"><div><div class=\"dn\">Fentanilo<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"fentanilo\" value=\"1\" step=\"0.5\" min=\"0\"> mcg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"fentanilo\" data-u=\"mcg\">—<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dcard\"><div><div class=\"dn\">Atropina<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"atropina\" value=\"0.01\" step=\"0.005\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"atropina\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv><\u002Fdiv>\n              <div class=\"dgrp\"><div class=\"dgl\">Inductores<\u002Fdiv>\n                <div class=\"drows\">\n                  <div class=\"dcard\"><div><div class=\"dn\">Etomidato<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"etomidato\" value=\"0.2\" step=\"0.05\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"etomidato\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dcard\"><div><div class=\"dn\">Ketamina<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"ketamina\" value=\"1\" step=\"0.5\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"ketamina\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dcard\"><div><div class=\"dn\">Propofol<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"propofol\" value=\"1\" step=\"0.5\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"propofol\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dcard\"><div><div class=\"dn\">Midazolam<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"midazolam\" value=\"0.05\" step=\"0.01\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"midazolam\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv><\u002Fdiv>\n              <div class=\"dgrp\"><div class=\"dgl\">Relajantes neuromusculares<\u002Fdiv>\n                <div class=\"drows\">\n                  <div class=\"dcard\"><div><div class=\"dn\">Succinilcolina<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"succinilcolina\" value=\"1\" step=\"0.5\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"succinilcolina\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                  <div class=\"dcard\"><div><div class=\"dn\">Rocuronio<\u002Fdiv><div class=\"dk\"><input type=\"number\" class=\"dv-k\" data-d=\"rocuronio\" value=\"1.2\" step=\"0.1\" min=\"0\"> mg/kg<\u002Fdiv><\u002Fdiv><div class=\"dvv\" data-o=\"rocuronio\" data-u=\"mg\">—<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv><\u002Fdiv>\n              <div class=\"cnote\">Dosis orientativas por <b>peso corporal total<\u002Fb>. Verifica siempre contra la presentación del fármaco y ajusta a la clínica (por ejemplo, inductor reducido si hay compromiso hemodinámico).<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"tsec\" id=\"tp-timer\">\n            <div class=\"tsec-h\"><span class=\"tsec-n\">2<\u002Fspan>Cronómetro + metrónomo<\u002Fdiv>\n            <div class=\"tw\">\n              <div class=\"tflex\">\n                <div class=\"tdisp\" id=\"tmD\">00:00<\u002Fdiv>\n                <div class=\"tc\">\n                  <button class=\"tb-start\" id=\"tmGo\">Iniciar<\u002Fbutton>\n                  <button class=\"tb-stop\" id=\"tmStop\">Pausar<\u002Fbutton>\n                  <button class=\"tb-reset\" id=\"tmRst\">Reiniciar<\u002Fbutton>\n                <\u002Fdiv>\n                <div class=\"tmeta\">Alerta automática <b>cada 2 min<\u002Fb><br>para revisar signos vitales y TA<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"tmetro\">\n                <span class=\"msw\" id=\"mtSw\" role=\"switch\" aria-checked=\"false\" sc-camel-tab-index=\"0\"><\u002Fspan>\n                <span class=\"mlab\">♪ Metrónomo 120/min<small>guía de compresiones (RCP)<\u002Fsmall><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"talert\" id=\"tmAlert\"><span>⏰ Han pasado <b id=\"tmMin\">2<\u002Fb> min — <b>revisa signos vitales y toma una nueva tensión arterial.<\u002Fb><\u002Fspan><button class=\"dm\" id=\"tmDm\">Entendido<\u002Fbutton><\u002Fdiv>\n              <div class=\"ahint\">🔊 Para que las alertas y el metrónomo se oigan en el móvil, sube el volumen multimedia del dispositivo.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"tsec\" id=\"tp-check\">\n            <div class=\"tsec-h\"><span class=\"tsec-n\">3<\u002Fspan>Checklist pre-intubación<\u002Fdiv>\n            <div class=\"clintro\">Recorre las cuatro columnas antes de inducir: <b>paciente · material · equipo humano · estrategia comunicada<\u002Fb>. DAS recomienda usar un checklist en toda intubación traqueal de emergencia. Toca cada ítem para marcarlo o desmarcarlo.<\u002Fdiv>\n            <div class=\"clbar\">\n              <span class=\"cln\"><b id=\"clDone\">0<\u002Fb> / <span id=\"clTot\">0<\u002Fspan> completados<\u002Fspan>\n              <span class=\"clprog\"><i id=\"clBar\"><\u002Fi><\u002Fspan>\n              <button class=\"clrst\" id=\"clReset\">Reiniciar<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"clgrid\" id=\"clGrid\">\n            <div class=\"clcol\"><h5>Preparar al paciente<\u002Fh5><div class=\"clbody\">\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Acceso intravenoso fiable<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Evaluación<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Riesgo de aspiración<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Intubación con paciente despierto (ATI) considerada<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Membrana cricotiroidea identificada (en caso de <abbr class=\"gt\" data-s=\"eFONA\" data-e=\"emergency Front Of Neck Access\" data-d=\"Acceso frontal del cuello de emergencia (cricotirotomía).\">eFONA<\u002Fabbr>)<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Optimización fisiológica<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Líquidos / vasopresor / inotrópico<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Aspirar / considerar sonda nasogástrica<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Posición optimizada<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Cabecera elevada (head-up)<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Preoxigenación<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">3 min o EtO₂ ≥ 90%<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Considerar OAFN / CPAP / <abbr class=\"gt\" data-s=\"VNI\" data-e=\"Ventilación No Invasiva\" data-d=\"Soporte ventilatorio con presión positiva a través de mascarilla, sin tubo endotraqueal.\">VNI<\u002Fabbr><\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Considerar oxigenación apneica<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv><\u002Fdiv>\n            <div class=\"clcol\"><h5>Preparar el material<\u002Fh5><div class=\"clbody\">\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Colocar monitores<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">SpO₂ / capnografía de onda / ECG / TA<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Comprobar el material<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Tubos traqueales × 2<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Videolaringoscopio<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Bougie / estilete<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Aspiración funcionante<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Cánula orofaríngea / nasofaríngea<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Fijación del tubo / cinta<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Broncoscopio flexible / catéter Aintree<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Cronómetro<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Comprobar los fármacos<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Agente de inducción<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Relajante muscular<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Vasopresor / inotrópico<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Mantenimiento de sedoanalgesia<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv><\u002Fdiv>\n            <div class=\"clcol\"><h5>Preparar el equipo humano<\u002Fh5><div class=\"clbody\">\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Asignar roles<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Líder del equipo<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">1.er intubador<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">2.º intubador<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Fármacos / jefe experimentad@<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Monitorización del paciente<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Apoyo / «runner»<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Cronometrador<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿Se espera dificultad fisiológica?<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿Quién está asignado a manejarla?<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿A quién llamamos si hay dificultad?<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿Dónde está?<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Datos de contacto<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿Quién realizará la eFONA?<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv><\u002Fdiv>\n            <div class=\"clcol\"><h5>Comunicar la estrategia<\u002Fh5><div class=\"clbody\">\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Plan A<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Videolaringoscopio<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Bougie / estilete<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Fármacos<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Kit de eFONA accesible de inmediato<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Plan B<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Inserción de <abbr class=\"gt\" data-s=\"DSG\" data-e=\"Dispositivo Supraglótico\" data-d=\"Dispositivo de vía aérea que se coloca por encima de la glotis, como la mascarilla laríngea.\">DSG<\u002Fabbr><\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Abrir el kit de eFONA<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Plan C<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Intento final de ventilación con mascarilla<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">Plan D<\u002Fspan><\u002Fdiv>\n              <div class=\"cli sub\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">eFONA<\u002Fspan><\u002Fdiv>\n              <div class=\"cli grp\"><span class=\"clbox\"><\u002Fspan><span class=\"cltx\">¿Alguna pregunta o inquietud del equipo?<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"srcfoot\" style=\"margin-top:14px\"><b>Fuente:<\u002Fb> adaptado y traducido del checklist de DAS 2025.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ── BURBUJAS DE SIGLAS ── -->\n      <div class=\"vp\" id=\"vp-sig\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">06<\u002Fspan>\n          <h3>Ninguna sigla <em>te frena<\u002Fem><\u002Fh3>\n          <p>Cada abreviatura lleva su burbuja. La lees sin salir de la línea en la que vas, sin abrir un glosario y sin perder el hilo del algoritmo.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Glosario emergente · 13 términos en esta guía<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-sig\" data-theme=\"light\">\n        <div class=\"wrapg\">\n          <div class=\"sg-hint\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><\u002Fsvg>\n            Pasa el cursor o toca las palabras subrayadas\n          <\u002Fdiv>\n\n          <div class=\"sg-demo\">\n            <p>Todo paciente crítico se asume de intubación complicada, así que la <abbr class=\"gt\" data-s=\"ISR / SIR / RSI\" data-e=\"\" data-d=\"Secuencia de Intubación Rápida\">ISR<\u002Fabbr> arranca antes de tocar al paciente. Si el <abbr class=\"gt\" data-s=\"BURP\" data-e=\"\" data-d=\"Maniobra de hacer presión en el cartílago tiroides hacia atrás, arriba y a la derecha (Backward, Upward, Rightward).\">BURP<\u002Fabbr> no mejora la visión y ya llevas los <abbr class=\"gt\" data-s=\"3+1\" data-e=\"\" data-d=\"Máximo de tres intentos de intubación; un cuarto y último intento debe realizarlo únicamente un profesional con mayor experiencia.\">3+1<\u002Fabbr> intentos, declaras fallo. Considera <abbr class=\"gt\" data-s=\"ATI\" data-e=\"\" data-d=\"Intubación Traqueal en paciente Despierto\">ATI<\u002Fabbr> si la anatomía lo anticipa, y ten el kit de <abbr class=\"gt\" data-s=\"eFONA\" data-e=\"\" data-d=\"Acceso de emergencia al Frente del Cuello (cricotirotomía)\">eFONA<\u002Fabbr> abierto desde el Plan B.<\u002Fp>\n            <p>Preoxigena con <abbr class=\"gt\" data-s=\"VNI\" data-e=\"\" data-d=\"Ventilación No Invasiva\">VNI<\u002Fabbr> cuando hay hipoxemia grave, o con <abbr class=\"gt\" data-s=\"CNAF\" data-e=\"\" data-d=\"Cánula nasal de alto flujo\">CNAF<\u002Fabbr> si esperas laringoscopia difícil — la llamada <abbr class=\"gt\" data-s=\"«Peroxigenación»\" data-e=\"\" data-d=\"Concepto de mantener flujo continuo desde antes de inducir, durante la apnea y la laringoscopia, hasta asegurar la vía aérea. Ideal con CNAF.\">peroxigenación<\u002Fabbr> mantiene flujo continuo hasta asegurar la vía aérea. Administra <b>siempre<\u002Fb> un inductor junto al <abbr class=\"gt\" data-s=\"BNM\" data-e=\"\" data-d=\"Bloqueador Neuromuscular\">BNM<\u002Fabbr>. Si fallas, inserta un <abbr class=\"gt\" data-s=\"DSG\" data-e=\"\" data-d=\"Dispositivo Supraglótico\">DSG<\u002Fabbr>; si tampoco ventilas, estás en <abbr class=\"gt\" data-s=\"CVCO\" data-e=\"\" data-d=\"«Cannot Ventilate, Cannot Oxygenate» / «Imposible Ventilar, Imposible Oxigenar»\">CVCO<\u002Fabbr> y, si además no intubas, en <abbr class=\"gt\" data-s=\"CICO\" data-e=\"\" data-d=\"«Cannot Intubate, Cannot Oxygenate» / «Imposible Intubar, Imposible Oxigenar»\">CICO<\u002Fabbr>. Ojo con la <abbr class=\"gt\" data-s=\"PIC\" data-e=\"\" data-d=\"Presión Intracraneal\">PIC<\u002Fabbr> elevada al premedicar.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"sg-split\">\n            <div>\n              <div class=\"sg-mock\">\n                <span class=\"s\">CICO<\u002Fspan>\n                <span class=\"e\">Cannot Intubate, Cannot Oxygenate<\u002Fspan>\n                «Imposible Intubar, Imposible Oxigenar»\n              <\u002Fdiv>\n              <p class=\"sg-cap\">Así se ve la burbuja: sigla en lima, desarrollo en inglés y definición en español.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"sg-list\">\n              <h4>13 términos en esta guía<\u002Fh4>\n              <dl>\n              <div class=\"sg-row\"><dt>ISR / SIR / RSI<\u002Fdt><dd>Secuencia de Intubación Rápida<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>VNI<\u002Fdt><dd>Ventilación No Invasiva<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>CNAF<\u002Fdt><dd>Cánula nasal de alto flujo<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>eFONA<\u002Fdt><dd>Acceso de emergencia al Frente del Cuello (cricotirotomía)<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>BNM<\u002Fdt><dd>Bloqueador Neuromuscular<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>DSG<\u002Fdt><dd>Dispositivo Supraglótico<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>3+1<\u002Fdt><dd>Máximo de tres intentos de intubación; un cuarto y último intento debe realizarlo únicamente un profesional con mayor experiencia.<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>BURP<\u002Fdt><dd>Maniobra de hacer presión en el cartílago tiroides hacia atrás, arriba y a la derecha (Backward, Upward, Rightward).<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>ATI<\u002Fdt><dd>Intubación Traqueal en paciente Despierto<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>PIC<\u002Fdt><dd>Presión Intracraneal<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>CVCO<\u002Fdt><dd>«Cannot Ventilate, Cannot Oxygenate» / «Imposible Ventilar, Imposible Oxigenar»<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>CICO<\u002Fdt><dd>«Cannot Intubate, Cannot Oxygenate» / «Imposible Intubar, Imposible Oxigenar»<\u002Fdd><\u002Fdiv>\n              <div class=\"sg-row\"><dt>«Peroxigenación»<\u002Fdt><dd>Concepto de mantener flujo continuo desde antes de inducir, durante la apnea y la laringoscopia, hasta asegurar la vía aérea. Ideal con CNAF.<\u002Fdd><\u002Fdiv>\n              <\u002Fdl>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- ── ILUSTRACIONES ── -->\n      <div class=\"vp\" id=\"vp-fig\">\n        <div class=\"vp-claim\">\n          <span class=\"vp-n\">07<\u002Fspan>\n          <h3>Ilustraciones propias, <em>no fotos de banco<\u002Fem><\u002Fh3>\n          <p>Los dispositivos y las maniobras vienen dibujados. Es lo único de la plataforma que un competidor no puede copiar en una tarde.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"vp-exhibit\" data-theme=\"light\">\n          <div class=\"vp-tag\"><span class=\"vt-l\"><i><\u002Fi>Fragmento real · <span>Fase 3 · Preoxigenar<\u002Fspan><\u002Fspan><span class=\"theme-sw\" role=\"group\" aria-label=\"Modo de color del fragmento\"><button type=\"button\" data-tema=\"light\" class=\"on\"><svg sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4\"><\u002Fpath><\u002Fsvg><span>Claro<\u002Fspan><\u002Fbutton><button type=\"button\" data-tema=\"dark\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><span>Oscuro<\u002Fspan><\u002Fbutton><\u002Fspan><\u002Fdiv>\n          <div class=\"gv on\" id=\"gv-fig\" data-theme=\"light\">\n        <div class=\"wrapg\">\n          <div class=\"phead\"><h4>3 · Preoxigenar — ¿cómo preoxigeno?<\u002Fh4><p>Ilustraciones propias. Los dispositivos vienen dibujados: no tienes que imaginarte el montaje.<\u002Fp><\u002Fdiv>\n          <ul class=\"rowli\" style=\"margin-top:14px\">\n            <li><b><abbr class=\"gt\" data-s=\"VNI\" data-e=\"Ventilación No Invasiva\" data-d=\"Soporte ventilatorio con presión positiva a través de mascarilla, sin tubo endotraqueal.\">VNI<\u002Fabbr><\u002Fb> en hipoxemia grave (PaO₂/FiO₂ &lt; 150): la mejor evidencia para reducir desaturación crítica. <span class=\"badge b-cond\">Condicional<\u002Fspan> <span class=\"cit\">SCCM Q2 · p1413<\u002Fspan><\u002Fli>\n            <li><b><abbr class=\"gt\" data-s=\"CNAF\" data-e=\"Cánula Nasal de Alto Flujo\" data-d=\"Oxígeno humidificado y calentado a flujos de 40–70 L/min por cánula nasal.\">CNAF<\u002Fabbr><\u002Fb> cuando se espera laringoscopia difícil; aporta oxigenación apneica. <span class=\"badge b-cond\">Condicional<\u002Fspan> <span class=\"cit\">SCCM Q2<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <div class=\"figs\">\n            <figure class=\"fg\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAGkAjADASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAAECAwQFBgcICf/EAFEQAAEDAgMEBQYJCAkEAgIDAQEAAgMEEQUSIQYxQVETImFxkQcUMoGh0RUjQlJTcpKxwRYzQ2KTstLhFyQ0NVRjc4LwJVWi8UTCCKMmRYOE/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACwRAQEAAgEEAgIBAwMFAAAAAAABAhEDBBIhMSJBE1EyBUJhFIGxM3GRofD/2gAMAwEA a-theme=\"light\">\n        <div class=\"wrapg\">\n          <div class=\"legend\">\n            <span><i class=\"lgd\" style=\"background:#6fd0a0\"><\u002Fi> Basados en la <b>evidencia<\u002Fb><\u002Fspan>\n            <span><i class=\"lgd\" style=\"background:#7fb2e0\"><\u002Fi> Basados en la <b>experiencia<\u002Fb><\u002Fspan>\n          <\u002Fdiv>\n\n          <div class=\"minihead\">Qué hace cada uno<\u002Fdiv>\n\n          <div class=\"expb exp-ev\">\n            <span class=\"exph\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"m12 2 2.6 6.6L22 9.3l-5 4.6 1.4 7.1L12 17.5 5.6 21l1.4-7.1-5-4.6 7.4-.7L12 2z\"><\u002Fpath><\u002Fsvg>Punto complementario · basado en la evidencia<\u002Fspan>\n            <div class=\"pearl\">Señala <b>costumbres clínicas muy extendidas que la guía no respalda<\u002Fb>, o matices que sí están publicados pero quedan enterrados en el documento original.<\u002Fdiv>\n            <div class=\"pearl\">Sirve para lo que la guía no te dice de frente: <b>en qué situaciones concretas una recomendación general deja de aplicar<\u002Fb>, y qué excepciones están descritas en la literatura.<\u002Fdiv>\n            <div class=\"pearl\">Siempre lleva su referencia detrás.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"expb exp-ex\">\n            <span class=\"exph\"><svg sc-camel-view-box=\"0 0 24 24\"><path d=\"M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1-5.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z\"><\u002Fpath><path d=\"M8 11h.01M12 11h.01M16 11h.01\"><\u002Fpath><\u002Fsvg>Punto complementario · basado en la experiencia<\u002Fspan>\n            <div class=\"pearl\">Recoge <b>cómo se hace realmente en el servicio<\u002Fb>: lo que aprendes de un especialista en el turno y no está escrito en ninguna parte.<\u002Fdiv>\n            <div class=\"pearl\">Cubre el hueco entre la guía y el hospital real — <b>disponibilidad de fármacos, hábitos del equipo, trucos de técnica<\u002Fb> y los ajustes prácticos que nadie publica.<\u002Fdiv>\n            <div class=\"pearl\">Va en azul justamente para que <b>no lo confundas con una recomendación<\u002Fb>. Es criterio de quien lo hace todos los días, y así queda declarado.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"srcfoot\" style=\"margin-top:18px\"><b>La regla:<\u002Fb> ninguna de las dos cajas toca el texto de la guía. Puedes leer solo lo publicado y saltártelas, o leerlas sabiendo exactamente qué peso tiene cada una.<\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ COMPARATIVA (versión A) ══ -->\n<section class=\"pA light\" id=\"comparativa\" data-sec=\"compare\">\n  <div class=\"wrap\">\n    <div class=\"sec-narrow reveal\">\n      <div class=\"eyebrow\">La diferencia<\u002Fdiv>\n      <h2>Contra lo que estás usando hoy<\u002Fh2>\n      <p class=\"lead\" style=\"max-width:66ch\">Sin trampas: cada opción sirve para algo, y varias las usas a diario. La pregunta es cuál responde en noventa segundos <b style=\"color:var(--t1);font-weight:500\">y<\u002Fb> te deja sustentar la decisión después.<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"mut2\" style=\"font-size:11.5px;margin:30px 0 8px;display:none\" id=\"swipe-hint\">← Desliza la tabla para ver todas las columnas →<\u002Fp>\n    <div class=\"cmp-wrap reveal\" style=\"margin-top:8px\">\n      <sc-raw-table class=\"cmp\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th class=\"cmp-corner\"><\u002Fsc-raw-th>\n          <sc-raw-th><span class=\"cmp-n\">Buscar en internet<\u002Fspan><span class=\"cmp-e\">portales médicos, blogs<\u002Fspan><\u002Fsc-raw-th>\n          <sc-raw-th><span class=\"cmp-n\">IA generativa<\u002Fspan><span class=\"cmp-e\">asistentes de uso general<\u002Fspan><\u002Fsc-raw-th>\n          <sc-raw-th><span class=\"cmp-n\">El PDF de la guía<\u002Fspan><span class=\"cmp-e\">ESC, AHA, GOLD<\u002Fspan><\u002Fsc-raw-th> .4 11.6\"><\u002Fpath><\u002Fsvg><\u002Fi>No lo resuelve<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ QUÉ HAY DENTRO HOY (de la versión A) ══ -->\n<section class=\"pA\" id=\"contenido\" data-sec=\"content\">\n  <div class=\"wrap\">\n    <div class=\"sec-narrow reveal\">\n      <div class=\"eyebrow\">Qué hay dentro<\u002Fdiv>\n      <h2>10 temas hoy. <span class=\"lime\">Y crece cada semana.<\u002Fspan><\u002Fh2>\n      <p class=\"lead\" style=\"max-width:66ch\">No empezamos por lo fácil. Empezamos por las urgencias donde una cifra mal recordada cambia el desenlace. Cada guía se abre con las preguntas reales que responde.<\u002Fp>\n    <\u002Fdiv>\n\n<div class=\"guides reveal\" style=\"margin-top:40px\">\n      <div class=\"guide\" style=\"border-left-color:var(--violet)\"><span class=\"sp\" style=\"color:var(--violet)\">Neumo · Adultos<\u002Fspan><b>Síndrome de agudización de la EPOC (SAE)<\u002Fb><p>¿Tiene neumonía, sigue siendo una agudización? ¿Es fracaso, recaída o recurrencia? ¿Me sirve el DECAF? ¿Cubro Pseudomonas? ¿Qué cifra de PCR, eosinófilos o troponina cambia mi conducta?<\u002Fp><div class=\"srcs\"><i>GesEPOC 2021<\u002Fi><i>GOLD 2026<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--red)\"><span class=\"sp\" style=\"color:var(--red)\">Cardio · Adultos<\u002Fspan><b>Síndrome coronario agudo (SCA)<\u002Fb><p>¿Cuáles son los puntos de corte de mi ensayo de troponina (0 h/1 h y 0 h/2 h)? ¿Qué reglas no puedo saltarme? Troponina alta que no es infarto tipo 1: ¿qué otras causas? Criterios ARC-HBR.<\u002Fp><div class=\"srcs\"><i>ESC 2023<\u002Fi><i>ACC/AHA/ACEP/NAEMSP/SCAI 2025<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--amber)\"><span class=\"sp\" style=\"color:var(--amber)\">Urgencias · Adultos<\u002Fspan><b>Reanimación cardiocerebropulmonar (RCCP)<\u002Fb><p>¿Qué NO puedo concluir con la ecografía en el paro? ¿Cuánto puede durar la pausa? Tormenta eléctrica: ¿qué me queda? Hipotermia: ¿cómo reanimo? Trasplantado, DAI, embarazo: ¿qué cambia?<\u002Fp><div class=\"srcs\"><i>AHA ACLS 2025<\u002Fi><i>Resuscitation Council UK<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--red)\"><span class=\"sp\" style=\"color:var(--red)\">Cardio · Adultos<\u002Fspan><b>Crisis hipertensiva<\u002Fb><p>Objetivo de PA y agente de 1.ª línea según la condición: ¿disección, SCA, edema pulmonar, HIC, ACV o eclampsia? ¿Nicardipino, labetalol, esmolol o nitroprusiato, y a qué dosis? ¿Cuándo cribo HTA secundaria?<\u002Fp><div class=\"srcs\"><i>ESC<\u002Fi><i>ACC/AHA<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--purple)\"><span class=\"sp\" style=\"color:var(--purple)\">Neuro · Adultos<\u002Fspan><b>ACV isquémico<\u002Fb><p>¿Puedo trombolizar con anticoagulación, plaquetas bajas o PA alta? ¿Y si despertó así? ¿Candidato a trombectomía según ventana y ASPECTS? ¿Y si el núcleo ya es grande? ¿Cuándo empiezo anticoagulación si tiene FA?<\u002Fp><div class=\"srcs\"><i>AHA/ASA<\u002Fi><i>ESO<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--teal)\"><span class=\"sp\" style=\"color:var(--teal)\">Endocrino · Adultos<\u002Fspan><b>Cetoacidosis diabética (CAD)<\u002Fb><p>¿Y la DKA euglucémica o el cuadro mixto? ¿Cuándo y cuánto potasio repongo? ¿Doy bicarbonato o fosfato? ¿Qué cambia en embarazo, adulto mayor, ERC o iSGLT2? ¿Y la vía aérea en acidemia severa?<\u002Fp><div class=\"srcs\"><i>ADA<\u002Fi><i>JBDS<\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"guide\" style=\"border-left-color:var(--teal)\"><span class=\"sp\" style=\"color:var(--teal)\">Endocrino · Adultos<\u002Fspan><b>Estado hiperglucémico hiperosmolar (EHH)<\u002Fb><p>¿Es HHS, DKA o mixto? ¿Cuánto ha perdido y qué fluido pongo, a qué ritmo? ¿Cuándo y cómo doy insulina? ¿Cómo repongo el potasio? ¿Cómo calculo la osmolalidad y cuándo va a UCI?<\u002Fp>
