 versión A) ── */\n.fuentes{border-top:0.5px solid var(--sep);border-bottom:0.5px solid var(--sep);padding:26px 0;overflow:hidden}\n.fuentes-lbl{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;\n  text-transform:uppercase;color:var(--t4);margin-bottom:16px}\n.fuentes-marq{display:flex;gap:34px;width:max-content;animation:fscroll 34s linear infinite}\n.fuentes-marq span{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--t3);white-space:nowrap}\n@keyframes fscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n@media(prefers-reduced-motion:reduce){.fuentes-marq{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}\n@media(max-width:700px){.fuentes{padding:20px 0}.fuentes-marq span{font-size:11.5px}.fuentes-marq{gap:22px}}\n\n\n/* ─────────── */\n\n\n    .hm-sh:hover { background: #181818 }\n    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }\n    \n/* ═══════════════════════════════════════════════════════════\n   CAPA RESPONSIVE — el escritorio (>1024px) queda intacto\n   Tablet ≤1024 · Móvil ≤760 · Pequeño ≤420\n   ═══════════════════════════════════════════════════════════ */\n\n/* ─────────── TABLET (≤1024px) ─────────── */\n@media (max-width:1024px){\n  .pA{ padding:72px 0 }\n  .hero{ padding:64px 0 56px }\n  .pA .wrap,.head-in,.hero-inner{ padding:0 22px }\n\n  /* el hero pasa a una columna: el mockup va debajo */\n  .hero-inner{ grid-template-columns:1fr !important; gap:36px !important }\n  .hero-sub{ max-width:none }\n\n  /* la nav completa no cabe: se reduce a lo esencial */\n  .head .nav li:nth-child(2),\n  .head .nav li:nth-child(5){ display:none }\n\n  .pA .g3{ grid-template-columns:1fr 1fr }\n  .gv .cgrid{ grid-template-columns:1fr 1fr }\n  .gv .clgrid{ grid-template-columns:1fr 1fr }\n}\n\n/* ─────────── MÓVIL (≤760px) ─────────── */\n@media (max-width:760px){\n  .pA{ padding:52px 0 }\n  .hero{ padding:40px 0 44px }\n  .pA .wrap,.head-in,.hero-inner{ padding:0 18px }\n\n  /* tipografía: un escalón menos, sin perder jerarquía */\n  .pA h2{ font-size:26px; line-height:1.16 }\n  .pA .lead,.hero-sub{ font-size:15.5px; line-height:1.6 }\n  .pA .card h3{ font-size:17px }\n  .pA .card p{ font-size:14px }\n  .vp-claim h3{ font-size:21px; line-height:1.2 }\n  .vp-claim p{ font-size:14.5px }\n  .pA .eyebrow{ font-size:10px; margin-bottom:10px }\n\n  /* cabecera: solo logo + CTA */\n  .head .nav{ display:none }\n  .head-in{ gap:12px }\n  .head-act .link-ghost{ display:none }\n  .logo-name{ font-size:12.5px }\n  .banner{ font-size:11.5px; padding:8px 14px; line-height:1.45 }\n\n  /* hero */\n  .hero-actions{ display:grid; grid-template-columns:1fr; gap:9px }\n  .hero-actions a{ justify-content:center; padding:13px 20px }\n  .hero-proof{ grid-template-columns:repeat(2,1fr) }\n\n  /* índice de valor: tira deslizable en vez de 8 botones apilados */\n  .vpindex{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;\n            margin:0 -18px 22px; padding:0 18px 4px; gap:6px }\n  .vpindex::-webkit-scrollbar{ display:none }\n  .vpi{ flex:0 0 auto; padding:9px 14px; font-size:12px }\n  .vp-claim{ margin-bottom:16px }\n  .vp-tag{ padding:9px 14px; font-size:8.5px; letter-spacing:.08em }\n\n  /* el artefacto ocupa todo el ancho útil */\n  .vp-exhibit{ margin:0 -18px; border-radius:0; border-left:none; border-right:none }\n  .gv .wrapg{ padding:0 16px }\n  .gv .mast{ padding:22px 18px 18px 26px }\n  .gv .mast::before{ left:12px }\n  .gv .cgrid,.gv .clgrid,.gv .figs,.gv .rf-legend,.gv .sg-split{ grid-template-columns:1fr }\n  .gv .drows{ grid-template-columns:1fr }\n  .gv .cg-feed,.gv .cg-tabs,.gv .hnav,.gv .cg-hero{ padding-left:16px; padding-right:16px }\n  .gv .cg-hero-title{ font-size:19px }\n  .gv .cg-card-body{ padding:14px 16px }\n  .gv .tflex{ gap:14px }\n  .gv .tmeta{ margin-left:0; text-align:left; width:100% }\n  .gv .calc-top{ gap:12px }\n  .gv .chint{ margin-left:0; max-width:none; flex-basis:100% }\n  .gv .swg button{ flex:1 1 auto; text-align:center }\n\n  /* tabla comparativa: se queda, con scroll y aviso */\n  .cmp{ min-width:640px; font-size:11.5px }\n  .cmp th,.cmp td{ padding:10px 9px }\n  .cmp thead th:first-child,.cmp tbody th,.cmp tfoot th{ min-width:136px }\n  .cmp .cmp-e{ display:none }\n  .cmp .chip{ width:24px;height:24px }\n  .cmp td.hi .chip{ width:26px;height:26px }\n  .cmp-key{ gap:14px; font-size:11px }\n\n  /* precios */\n  .plans-grid{ grid-template-columns:1fr }\n  .plan-price{ font-size:32px }\n  .cd-strip{ flex-direction:column; align-items:flex-start; gap:14px; padding:14px 16px }\n  .cd-nums{ align-self:stretch; justify-content:space-between }\n  .cd-box{ flex:1 }\n  .plan-btn{ padding:13px }\n\n  /* guías y tarjetas */\n  .guides{ grid-template-columns:1fr }\n  .pA .g3{ grid-template-columns:1fr }\n}\n\n/* ─────────── PEQUEÑO (≤420px) ─────────── */\n@media (max-width:420px){\n  .pA .wrap,.head-in,.hero-inner{ padding:0 15px }\n  .vpindex{ margin:0 -15px 20px; padding:0 15px 4px }\n  .vp-exhibit{ margin:0 -15px }\n  .pA h2{ font-size:23px }\n  .vp-claim h3{ font-size:19px }\n  .plan-price{ font-size:28px }\n  .hero-proof{ grid-template-columns:1fr 1fr }\n  .cd-box i{ font-size:18px }\n  .gv .wrapg{ padding:0 13px }\n}\n\n/* ─────────── ÁREAS TÁCTILES (cualquier pantalla táctil) ─────────── */\n@media (hover:none){\n  .vpi,.gv .swg button,.gv .cg-tab,.clrst{ min-height:40px }\n  .gv .q,.gv .cli{ padding-top:9px; padding-bottom:9px }\n  .gv abbr.gt{ padding:2px 0 }\n}\n\n\n/* ─────────── MENÚ MÓVIL ─────────── */\n.nav-toggle{ display:none; flex-direction:column; justify-content:center; gap:4px;\n  width:38px; height:38px; padding:0 9px; background:none; border:none; cursor:pointer }\n.nav-toggle span{ display:block; height:1.5px; background:var(--t2); border-radius:2px; transition:.2s }\n.nav-toggle[aria-expanded=\"true\"] span:nth-child(1){ transform:translateY(5.5px) rotate(45deg) }\n.nav-toggle[aria-expanded=\"true\"] span:nth-child(2){ opacity:0 }\n.nav-toggle[aria-expanded=\"true\"] span:nth-child(3){ transform:translateY(-5.5px) rotate(-45deg) }\n.mobile-nav{ display:none; flex-direction:column; background:var(--bg-card);\n  border-top:0.5px solid var(--sep); padding:6px 18px 14px }\n.mobile-nav.open{ display:flex }\n.mobile-nav a{ font-size:15px; color:var(--t2); padding:13px 0; border-bottom:0.5px solid var(--sep) }\n.mobile-nav a:last-child{ border-bottom:none }\n.mobile-nav .mn-cta{ color:var(--lime-text); font-weight:600; margin-top:4px }\n@media (max-width:760px){\n  .nav-toggle{ display:flex }\n  .head{ position:sticky }\n}\n\n\n/* sin scroll lateral accidental en móvil */\n@media (max-width:760px){\n  html,body{ overflow-x:hidden }\n  #swipe-hint{ display:block!important; color:var(--t3); font-family:var(--mono);\n               font-size:10.5px; letter-spacing:.04em; text-align:center }\n}\n\n\n/* ═══════════════════════════════════════════════════════════\n   SECCIONES CLARAS — la landing alterna como la plataforma\n   Solo se redefinen tokens: el resto del CSS no cambia.\n   ═══════════════════════════════════════════════════════════ */\n.pA.light{\n  --bg:#f4f6f2;\n  --bg-card:#ffffff;\n  --bg-card2:#f0f2ec;\n  --bg-hover:#eaeee4;\n  --border:#e0e4d9;\n  --border-hi:#cdd3c2;\n  --sep:#e7eae1;\n  --t1:#14170f;\n  --t2:#474b41;\n  --t3:#676c5f;\n  --t4:#797f71;\n  --lime-text:#556f00;\n  --lime-d:#4a6000;\n  --lime-bg:rgba(120,158,0,.13);\n  --lime-bdr:rgba(120,158,0,.32);\n  background:var(--bg);\n  color:var(--t1);\n  border-top:1px solid #dfe3d8;\n}\n/* el lima de marca sigue siendo el mismo en fondos: negro sobre lima = 13:1 */\n.pA.light .btn-lime,\n.pA.light .plan-btn.lime,\n.pA.light .plan-banner,\n.pA.light .cg-tab--active,\n.pA.light .vpi.on{ background:#addc00; color:#000; border-color:#addc00 }\n.pA.light .vpi.on b{ color:rgba(0,0,0,.5) }\n\n/* la barra lima de los acentos se oscurece para que se vea sobre blanco */\n.pA.light .clprog i,\n.pA.light .plan-cd .cd-box i{ color:#556f00 }\n.pA.light .cd-box i{ color:#556f00 }\n.pA.light .cd-strip{ background:rgba(120,158,0,.10); border-color:rgba(120,158,0,.30) }\n.pA.light .plan.best{ background:#f7f9f3 }\n.pA.light .pf-y{ background:rgba(120,158,0,.15); border-color:rgba(120,158,0,.35) }\n.pA.light .pf-y svg{ stroke:#556f00 }\n.pA.light .pf-n svg{ stroke:var(--t4) }\n\n/* tabla comparativa en claro */\n.pA.light .cmp,\n.pA.light .cmp-key{\n  --ok:#17914f;   --ok-bg:rgba(23,145,79,.12);\n  --mid:#c07a06;  --mid-bg:rgba(192,122,6,.13);\n  --nope:#c93030; --nope-bg:rgba(201,48,48,.11);\n}\n.pA.light .cmp thead th{ background:#eef1e9 }\n.pA.light .cmp thead th.hi{ background:var(--lime) }\n.pA.light .cmp thead th:first-child,\n.pA.light .cmp tbody th,\n.pA.light .cmp tfoot th{ background:#eef1e9 }\n.pA.light .cmp tbody td{ background:#ffffff }\n.pA.light .cmp tbody tr:nth-child(even) td:not(.hi){ background:#fafbf7 }\n.pA.light .cmp tbody tr:hover th{ background:#e6ebdd }\n.pA.light .cmp tbody td.hi{ background:rgba(120,158,0,.10) }\n.pA.light .cmp tbody tr:hover td.hi{ background:rgba(120,158,0,.16) }\n.pA.light .cmp tfoot th{ background:#eef1e9 }\n.pA.light .cmp tfoot td{ background:#f0f2ec }\n.pA.light .cmp tfoot td.hi{ background:rgba(120,158,0,.20); color:#4a6000 }\n.pA.light .cmp td.hi .cval{ color:#4a6000 }\n.pA.light .cmp-wrap{ box-shadow:0 18px 44px -26px rgba(20,23,15,.28) }\n\n/* el fragmento de plataforma se queda OSCURO: es el dispositivo sobre la página */\n.pA.light .vp-exhibit{\n  border-color:#d5dacb;\n  box-shadow:0 18px 44px -18px rgba(20,23,15,.30), 0 2px 8px -2px rgba(20,23,15,.10);\n}\n.pA.light .vp-tag{ background:#0a0b0c; border-bottom-color:rgba(255,255,255,.08); color:#8f9297 }\n.pA.light .vp-tag span{ color:#b8bbbe }\n\n/* tarjetas de guía */\n.pA.light .guide{ border-left-color:var(--border-hi) }\n.pA.light .guide .srcs i{ background:#fff }\n\n/* separador entre una sección clara y la siguiente oscura */\n.pA.light + .pA{ border-top-color:#dfe3d8 }\n\n\n/* ── el fragmento se comporta como la pantalla de un dispositivo:\n      alto acotado y scroll propio, en vez de estirar la página ── */\n.vp-exhibit{ position:relative }\n.vp-exhibit .gv{\n  max-height:min(58vh,540px);\n  overflow-y:auto;\n  overscroll-behavior:contain;\n  scrollbar-width:thin;\n  scrollbar-color:rgba(173,220,0,.35) transparent;\n}\n.vp-exhibit .gv::-webkit-scrollbar{ width:8px }\n.vp-exhibit .gv::-webkit-scrollbar-track{ background:transparent }\n.vp-exhibit .gv::-webkit-scrollbar-thumb{\n  background:rgba(255,255,255,.14); border-radius:8px;\n  border:2px solid transparent; background-clip:content-box;\n}\n.vp-exhibit .gv:hover::-webkit-scrollbar-thumb{ background:rgba(173,220,0,.45); background-clip:content-box }\n/* desvanecido inferior: avisa de que hay más contenido */\n.vp-exhibit::after{\n  content:''; position:absolute; left:1px; right:9px; bottom:1px; height:52px;\n  background:linear-gradient(180deg,rgba(14,16,18,0),rgba(14,16,18,.92));\n  pointer-events:none; border-radius:0 0 var(--r-lg) var(--r-lg);\n}\n@media (max-width:760px){\n  .vp-exhibit .gv{ max-height:min(62vh,460px) }\n  .vp-exhibit::after{ left:0; right:8px; border-radius:0 }\n}\n\n\n/* — las tres herramientas, una tras otra — */\n.gv .tsec{ margin-top:22px }\n.gv .tsec:first-of-type{ margin-top:18px }\n.gv .tsec-h{ display:flex; align-items:center; gap:10px; font-family:var(--gsans); font-size:14px;\n  font-weight:700; color:var(--gink); letter-spacing:-.015em; margin-bottom:11px;\n  padding-bottom:9px; border-bottom:1px solid var(--gborder) }\n.gv .tsec-n{ flex:none; width:20px; height:20px; border-radius:50%; background:var(--brand-bg);\n  border:1px solid var(--brand-line); color:var(--brand-ink); font-family:var(--gmono);\n  font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center }\n\n\n/* ═══════════════════════════════════════════════════════════\n   FRAGMENTO EN MODO CLARO — tokens de [data-theme=\"light\"]\n   del tema cliniguia + del tema claro de la guía\n   ═══════════════════════════════════════════════════════════ */\n.gv[data-theme=\"light\"]{\n  --gbg:#fafafa; --surface:#ffffff; --surface2:#f4f4f2;\n  --gborder:#e6e6e2; --border-hi-g:#d8d8d2; --sepg:#ebebe7;\n  --gink:#141414; --muted:#46464a; --faint:#74747a; --t3g:#74747a; --t4g:#8e8e94;\n  --brand:#addc00; --brand-ink:#5f7a00;\n  --brand-bg:rgba(150,180,0,.13); --brand-line:rgba(150,180,0,.34);\n  --steel2:#1a6ea3; --gnavy:#15263f;\n  --gwarn:#c0392b; --gwarn-bg:rgba(192,57,43,.07);\n  --gok:#2f8a5c;   --gok-bg:rgba(47,138,92,.10);\n  --gamber:#a9791a; --gamber-bg:rgba(169,121,26,.10); --gamber-line:rgba(169,121,26,.30);\n}\n/* ajustes que no salen de los tokens */\n.gv[data-theme=\"light\"] .cg-card:hover{ background:#fff; box-shadow:0 3px 12px rgba(0,0,0,.07) }\n.gv[data-theme=\"light\"] .cli:hover{ background:#f4f4f2 }\n.gv[data-theme=\"light\"] .cli.checked .clbox::after{ color:#141414 }\n.gv[data-theme=\"light\"] .sn{ color:#141414 }\n.gv[data-theme=\"light\"] .clcol h5{ background:#f4f4f2 }\n.gv[data-theme=\"light\"] .wkg{ background:#fff }\n.gv[data-theme=\"light\"] .dcard .dk input{ background:#fff }\n.gv[data-theme=\"light\"] .tb-reset{ background:#fff }\n.gv[data-theme=\"light\"] .msw::before{ background:#fff }\n.gv[data-theme=\"light\"] .hacct,\n.gv[data-theme=\"light\"] .cg-tab--active{ color:#000 }\n\n/* interruptor de tema, igual que el de la plataforma */\n.vp-tag{ justify-content:space-between }\n.vp-tag .vt-l{ display:flex; align-items:center; gap:8px }\n.theme-sw{ display:inline-flex; align-items:center; gap:0; background:rgba(255,255,255,.06);\n  border:1px solid rgba(255,255,255,.12); border-radius:var(--r-pill); padding:2px; flex:none }\n.theme-sw button{ display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:8.5px;\n  letter-spacing:.08em; text-transform:uppercase; color:var(--t4); background:none; border:none;\n  border-radius:var(--r-pill); padding:4px 9px; cursor:pointer; transition:.15s; line-height:1 }\n.theme-sw button svg{ width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round }\n.theme-sw button:hover{ color:var(--t2) }\n.theme-sw button.on{ background:var(--lime); color:#000 }\n@media(max-width:620px){ .theme-sw button span{ display:none } .theme-sw button{ padding:5px 8px } }\n\n\n/* la barra de etiqueta sigue el tema del fragmento, no el de la sección */\n.vp-exhibit[data-theme=\"light\"] .vp-tag{\n  background:#f0f0ec; border-bottom-color:#e2e2dd; color:#8e8e94;\n}\n.vp-exhibit[data-theme=\"light\"] .vp-tag span{ color:#46464a }\n.vp-exhibit[data-theme=\"light\"] .theme-sw{\n  background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.10);\n}\n.vp-exhibit[data-theme=\"light\"] .theme-sw button{ color:#74747a }\n.vp-exhibit[data-theme=\"light\"] .theme-sw button:hover{ color:#141414 }\n.vp-exhibit[data-theme=\"light\"] .theme-sw button.on{ background:#addc00; color:#000 }\n/* el desvanecido inferior también */\n.vp-exhibit[data-theme=\"light\"]::after{\n  background:linear-gradient(180deg,rgba(250,250,250,0),rgba(250,250,250,.94));\n}\n/* dentro de una sección oscura, el fragmento claro necesita separarse del fondo */\n.pA:not(.light) .vp-exhibit{\n  box-shadow:0 20px 50px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05);\n}\n.pA:not(.light) .vp-exhibit[data-theme=\"light\"]{ border-color:#2e2e2e }\n\n\n/* ── índice lateral: la pantalla entra en vista sin desplazarse ── */\n@media (min-width:1025px){\n  .vpwrap{ display:grid; grid-template-columns:236px minmax(0,1fr); gap:34px; align-items:start }\n  .vpindex{\n    flex-direction:column; gap:4px; margin:0;\n    align-self:start;\n  }\n  .vpi{\n    width:100%; justify-content:flex-start; gap:11px;\n    padding:10px 14px; border-radius:9px; font-size:13px; line-height:1.3;\n  }\n  .vpi b{ font-size:10.5px; opacity:.75 }\n  .vpi.on{ box-shadow:0 4px 14px -6px rgba(173,220,0,.5) }\n  .pA.light .vpi.on{ box-shadow:0 4px 14px -6px rgba(120,158,0,.45) }\n\n  /* la afirmación se compacta: menos scroll hasta la pantalla */\n  .vp-claim{ max-width:none; margin-bottom:16px }\n  .vp-n{ margin-bottom:8px }\n  .vp-claim h3{ font-size:clamp(20px,1.9vw,25px); line-height:1.16; margin-bottom:8px }\n  .vp-claim p{ font-size:14.5px; line-height:1.55; max-width:74ch }\n\n  /* con menos altura ocupada arriba, la pantalla puede crecer */\n  .vp-exhibit .gv{ max-height:min(66vh,600px) }\n}\n\n\n\n/* ─────────── */\n\n\n/* ══════════════════════════════════════════════════════════════════\n   CAPA MÓVIL v2 — Clinical Hub\n   · Mismo ORDEN que el escritorio (se anula el reordenado por flex)\n   · Mismo CONTENIDO (nada oculto que sí se ve en escritorio)\n   · Solo actúa por debajo de 760px. Escritorio (>1024px) intacto.\n   Va al final del <head>/<body>: gana por orden de cascada.\n   ══════════════════════════════════════════════════════════════════ */\n\n/* ─────────────────────────────────────────────────────────────\n   1 · ORDEN — el DOM ya está en el orden del escritorio.\n   Reglas viejas ponían body{display:flex} + order:N y las\n   secciones sin `order` (p. ej. #contenido) saltaban al inicio.\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  body{ display:block !important; }\n  body > *,\n  header.head, section.hero, .fuentes,\n  #problema, #producto, #comparativa, #contenido, #precios{\n    order:0 !important;\n  }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   2 · RITMO VERTICAL Y MARGEN LATERAL ÚNICO\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  html,body{ overflow-x:hidden; }\n\n  .pA,\n  #problema, #producto, #comparativa, #contenido, #precios{\n    padding:54px 0 !important;\n  }\n  .fuentes, [data-sec=\"logos\"]{ padding:18px 0 !important; }\n\n  .pA .wrap{ padding:0 18px !important; }\n  .head-in{ padding:0 18px !important; }\n  .hero-inner{ padding:0 18px !important; }\n\n  /* tipografía: un escalón menos, misma jerarquía */\n  .pA h2{ font-size:26px !important; line-height:1.16 !important; }\n  .pA .lead{ font-size:15.5px !important; line-height:1.62 !important; }\n  .pA .eyebrow{ font-size:10px !important; margin-bottom:10px !important; }\n  .pA .card h3{ font-size:17px; }\n  .pA .card p{ font-size:14px; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   3 · CABECERA — logo + CTA + hamburguesa\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  .head{ position:sticky; top:0; }\n  .head-in{ gap:10px; height:54px; }\n  .head .nav{ display:none !important; }\n  .head-act .link-ghost{ display:none !important; }\n  .logo-name{ font-size:12.5px; }\n  .head-act .btn-sm{ font-size:12.5px; padding:8px 14px; }\n  .nav-toggle{ display:flex !important; }\n  .banner{ font-size:11.5px; padding:8px 14px; line-height:1.45; }\n  .mobile-nav a{ min-height:44px; display:flex; align-items:center; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   4 · HERO — misma secuencia que en escritorio:\n   eyebrow → título → subtítulo → botones → cifras → mockup\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  .hero{ padding:34px 0 42px !important;\n         border-top:none !important; border-bottom:none !important; }\n\n  .hero-inner{ grid-template-columns:1fr !important;\n               gap:30px !important; align-items:start !important; }\n\n  /* columna izquierda: flujo natural, sin `order` inventado */\n  .hero-inner > div:first-child{\n    display:flex !important; flex-direction:column !important; gap:0 !important;\n  }\n  .hero-eyebrow, h1.hero-title, .hero-sub,\n  .hero-actions, .hero-proof{ order:0 !important; }\n\n  /* mismo texto del eyebrow que en escritorio */\n  .eyebrow-desktop{ display:inline !important; }\n  .eyebrow-mobile { display:none   !important; }\n\n  .hero-eyebrow{ align-self:flex-start; font-size:10px;\n                 padding:5px 11px; margin-bottom:14px !important; }\n  h1.hero-title{ font-size:31px !important; line-height:1.08 !important;\n                 margin-bottom:14px !important; }\n  .hero-sub{ font-size:15.5px !important; line-height:1.62 !important;\n             max-width:none !important; margin-bottom:22px !important; }\n\n  /* botones: vuelven a mostrarse, apilados y a ancho completo */\n  .hero-actions{ display:grid !important; grid-template-columns:1fr !important;\n                 gap:9px !important; margin-bottom:24px !important; }\n  .hero-actions a{ justify-content:center; padding:14px 20px; font-size:14.5px; }\n  .hero-actions .btn-lime{ background:var(--lime) !important; color:#000 !important;\n                           border:none !important; font-weight:600 !important; }\n  .hero-actions .btn-ghost{ border:0.5px solid var(--border) !important; }\n\n  /* cifras: 2×2 con separadores correctos */\n  .hero-proof{ grid-template-columns:repeat(2,1fr) !important; margin:0 !important; }\n  .proof-item{ padding:13px 10px; }\n  .proof-item:nth-child(2n){ border-right:none; }\n  .proof-item:nth-child(-n+2){ border-bottom:0.5px solid var(--border); }\n  .proof-n{ font-size:19px !important; }\n  .proof-l{ font-size:9.5px; }\n\n  /* la lista estática queda oculta, igual que en escritorio */\n  .hero-static-list{ display:none !important; }\n\n  /* mockup animado, debajo del texto */\n  #hero-mockup-anim{ display:block !important; }\n  .hero-mockup{ display:block !important; width:100%; height:372px;\n                margin-top:0 !important; border-radius:var(--r-lg);\n                overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5); }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   5 · EL PROBLEMA — 6 tarjetas en una columna\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  #problema .g3{ grid-template-columns:1fr !important; gap:12px; }\n  #problema .g3{ margin-top:32px !important; }\n  #problema .card{ padding:20px 18px; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   6 · PRODUCTO — índice deslizable + fragmento a sangre\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  .vpwrap{ margin-top:30px; }\n  .vpindex{ flex-wrap:nowrap !important; overflow-x:auto;\n            scrollbar-width:none; -webkit-overflow-scrolling:touch;\n            margin:0 -18px 20px !important; padding:0 18px 4px !important; gap:6px; }\n  .vpindex::-webkit-scrollbar{ display:none; }\n  .vpi{ flex:0 0 auto; padding:10px 14px; font-size:12px; min-height:40px; }\n\n  .vp-claim{ margin-bottom:16px; }\n  .vp-claim h3{ font-size:21px; line-height:1.2; }\n  .vp-claim p{ font-size:14.5px; }\n\n  .vp-exhibit{ margin:0 -18px !important; border-radius:0 !important;\n               border-left:none !important; border-right:none !important; }\n  .vp-tag{ padding:9px 14px; font-size:8.5px; letter-spacing:.08em; }\n  .vp-exhibit .gv{ max-height:min(64vh,470px); }\n\n  /* todo lo que dentro del fragmento va en rejilla, pasa a una columna */\n  .gv .cgrid, .gv .clgrid, .gv .figs,\n  .gv .rf-legend, .gv .sg-split, .gv .rf-steps,\n  .gv .drows{ grid-template-columns:1fr !important; }\n  .gv .wrapg{ padding:0 16px; }\n  .gv .cg-feed, .gv .cg-tabs, .gv .hnav, .gv .cg-hero{\n    padding-left:16px; padding-right:16px; }\n  .gv .cg-hero-title{ font-size:19px; }\n  .gv .tmeta{ margin-left:0; text-align:left; width:100%; }\n  .gv .chint{ margin-left:0; max-width:none; flex-basis:100%; }\n  .gv .swg button{ flex:1 1 auto; text-align:center; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   7 · COMPARATIVA — tabla completa, con scroll horizontal\n   (se recuperan los subtítulos de columna que estaban ocultos)\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  #swipe-hint{ display:block !important; color:var(--t3);\n               font-family:var(--mono); font-size:10.5px;\n               letter-spacing:.04em; text-align:center; }\n  .cmp-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }\n  .cmp{ min-width:660px; font-size:11.5px; }\n  .cmp th, .cmp td{ padding:10px 9px; }\n  .cmp .cmp-e{ display:block !important; font-size:8.5px; line-height:1.3; }\n  .cmp thead th.hi .cmp-e{ font-size:9.5px; }\n  .cmp thead th:first-child,\n  .cmp tbody th, .cmp tfoot th{ min-width:140px; }\n  .cmp .chip{ width:24px; height:24px; }\n  .cmp td.hi .chip{ width:26px; height:26px; }\n  .cmp-key{ gap:14px; font-size:11px; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   8 · CONTENIDO — guías en una columna + barra \"en cola\"\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  .guides{ grid-template-columns:1fr !important; margin-top:30px !important; }\n  .guide{ padding:18px 16px; }\n\n  .soon{ margin-top:28px; padding-top:22px; }\n  .fbar{ grid-template-columns:1fr !important; }\n  .fbar-a, .fbar-c{ padding:16px 18px; }\n  .fbar-b{ padding:16px 18px;\n           border-left:none !important; border-right:none !important;\n           border-top:1px solid rgba(0,0,0,.16);\n           border-bottom:1px solid rgba(0,0,0,.16); }\n  .fbar-b p{ font-size:14px; max-width:none; }\n  .fbar-c b, .fbar-c span{ white-space:normal !important; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   9 · PRECIOS — contador apilado + planes en una columna\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:760px){\n  .cd-strip{ flex-direction:column; align-items:flex-start;\n             gap:14px; padding:16px !important; margin-top:30px !important; }\n  .cd-nums{ align-self:stretch; justify-content:space-between; }\n  .cd-box{ flex:1; }\n  .cd-box i{ font-size:18px; }\n\n  .plans-grid{ grid-template-columns:1fr !important; }\n  .plan{ padding:24px 18px; }\n  .plan-price{ font-size:31px; }\n  .plan-cd .cd-box{ min-width:34px; }\n  .plan-cd .cd-box i{ font-size:15px; }\n  .plan-feats{ gap:11px; }\n  .plan-feats li{ font-size:13.5px; line-height:1.5; }\n  .plan-btn{ padding:14px; font-size:13.5px; }\n  .plan-note{ font-size:12px; line-height:1.6; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   10 · PANTALLA PEQUEÑA (≤430px)\n   ───────────────────────────────────────────────────────────── */\n@media (max-width:430px){\n  .pA .wrap, .head-in, .hero-inner{ padding-left:15px !important; padding-right:15px !important; }\n  .vpindex{ margin:0 -15px 18px !important; padding:0 15px 4px !important; }\n  .vp-exhibit{ margin:0 -15px !important; }\n  h1.hero-title{ font-size:28px !important; }\n  .pA h2{ font-size:23px !important; }\n  .vp-claim h3{ font-size:19px; }\n  .plan-price{ font-size:28px; }\n  .hero-mockup{ height:348px; }\n  .cd-box i{ font-size:17px; }\n  .gv .wrapg{ padding:0 13px; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   11 · ÁREAS TÁCTILES\n   ───────────────────────────────────────────────────────────── */\n@media (hover:none){\n  .vpi, .gv .swg button, .gv .cg-tab, .clrst,\n  .hero-actions a, .plan-btn{ min-height:44px; }\n  .gv .q, .gv .cli{ padding-top:9px; padding-bottom:9px; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   12 · FAQ\n   ───────────────────────────────────────────────────────────── */\n/* guion lima antes del eyebrow, solo en esta sección */\n.faq-eyebrow{ display:flex; align-items:center; gap:10px; }\n.faq-eyebrow::before{ content:''; width:16px; height:1px;\n                      background:var(--lime); flex-shrink:0; }\n#faq .faq-intro h2{ line-height:1.05; }\n#faq .faq-intro .lead{ max-width:34ch; }\n/* techo de despliegue generoso: las respuestas largas no se cortan */\n.faq-item.open .faq-a{ max-height:560px !important; }\n\n@media (max-width:760px){\n  #faq{ padding:54px 0 !important; }\n  .faq-layout{ grid-template-columns:1fr !important; gap:26px !important; }\n  #faq .faq-intro h2{ font-size:26px !important; }\n  #faq .faq-intro h2 br{ display:none; }\n  #faq .faq-intro .lead{ max-width:none; }\n  #faq .btn-ghost{ display:flex; justify-content:center;\n                   width:100%; padding:14px 20px; }\n  .faq-q{ font-size:15px !important; padding:15px 0 !important;\n          align-items:flex-start !important; min-height:44px; }\n  .faq-plus{ margin-top:2px; }\n  .faq-a{ font-size:14.5px !important; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   13 · CTA FINAL + FOOTER LEGAL\n   ───────────────────────────────────────────────────────────── */\n.cta-final{ border-top:1px solid var(--sep); }\n.cta-final .cta-title .lime{ color:var(--lime-text); }\n.cta-final .cta-eyebrow .hero-pulse{ width:6px; height:6px; }\n\n.cg-foot{ padding:36px 28px 26px; }\n.f-brand-mark{ margin-right:2px; }\n\n.f-legal-inline a{ color:var(--t4); }\n.f-legal-inline a:hover{ color:var(--t2); }\n\n@media (max-width:900px){\n  .cg-foot-inner{ grid-template-columns:1fr 1fr; gap:28px; }\n}\n@media (max-width:760px){\n  .cta-final{ padding:56px 18px !important; }\n  .cta-title{ font-size:29px !important; line-height:1.1 !important; }\n  .cta-sub{ font-size:15px !important; margin-bottom:24px !important; }\n  .cta-actions{ display:grid !important; grid-template-columns:1fr; gap:9px; }\n  .cta-actions a{ justify-content:center; padding:14px 20px; }\n  .cta-note{ font-size:11.5px; }\n\n  .cg-foot{ padding:32px 18px 24px !important; }\n  .cg-foot-inner{ grid-template-columns:1fr !important; gap:26px !important; }\n  .f-desc{ max-width:none; }\n  .f-links a{ display:inline-block; padding:5px 0; font-size:13.5px; }\n  .f-bottom{ flex-direction:column; align-items:flex-start; gap:10px; }\n  .f-legal-inline{ line-height:2; }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   14 · TIPOGRAFÍA DEL HERO = tipografía de la CTA final\n   (la línea 1395 lo bajaba a 600/-.035em; se restituye a 700/-.04em)\n   ───────────────────────────────────────────────────────────── */\nh1.hero-title{ font-weight:700 !important; letter-spacing:-.04em !important; }\n\n/* ─────────────────────────────────────────────────────────────\n   15 · FRAGMENTOS QUE ABREN CON .wrapg\n   .gv y .wrapg no definen padding superior, así que el primer\n   elemento quedaba pegado a la barra \"Fragmento real\".\n   Afecta a algo · ref · tool · sig · fig · pc (no a home ni preg,\n   que abren con .hnav / .mast y ya traen su propio espacio).\n   ───────────────────────────────────────────────────────────── */\n.gv > .wrapg:first-child{ padding-top:24px; }\n.gv .sg-hint{ margin-top:0; }\n\n@media (max-width:760px){\n  .gv > .wrapg:first-child{ padding-top:18px; }\n}\n\n/* ═══════════════════════════════════════════════════════════\n   16 · MOCKUP DEL HERO — recorrido real por la guía de SIR\n   Todo lleva prefijo cx- y va acotado a #cx-mock: la landing y\n   el mockup compartían 20 nombres de clase (.q, .calc, .back…).\n   ═══════════════════════════════════════════════════════════ */\n/* variables propias del mockup: vivían en el :root del laboratorio y se\n   perdieron al extraer el CSS (por eso los botones salían cuadrados) */\n#cx-mock{\n /* invariantes (no dependen del modo) */\n --pill:999px;\n --f:'DM Sans',-apple-system,sans-serif;\n --m:'IBM Plex Mono',ui-monospace,monospace;\n --lime-t:#c2f03a;\n --navy:#15263f;   /* fondos navy: la cápsula los re-fija en ambos modos */\n --tsc:.214s;   /* transición de pantalla, ya a 1,4x */\n --trl:.443s;   /* desplazamiento              */\n --tcu:.357s;   /* cursor                      */\n}\n/* ── MODO OSCURO (por defecto, igual que el tema en Ghost) ── */\n#cx-mock{--gb:#0e1012;--sf:#181a1c;--sf2:#202220;--bl:rgba(255,255,255,.10);\n --ink:#f0f2f4;--mut:#c4c7cb;--fnt:#8f9297;\n --br:#addc00;--bi:#c2f03a;--bbg:rgba(173,220,0,.11);--bln:rgba(173,220,0,.28);\n --steel:#7fb2e0;--steel2:#7fb2e0;--warn:#f08a78;--wbg:rgba(240,138,120,.12);--wln:rgba(240,138,120,.28);--ok:#6fd0a0;\n --ind:#7fb2e0;--ind-bg:rgba(127,178,224,.10);--ind-ln:rgba(127,178,224,.40);\n --par:#f0857a;--par-bg:rgba(240,133,122,.10);--par-ln:rgba(240,133,122,.40);\n --sky-pale:#202220;\n --q-ic-bg:rgba(173,220,0,.16);--q-ic-stroke:#c2f03a;--q-arrow:#addc00;--q-line:rgba(173,220,0,.28);\n --lime-cite:#c2f03a;\n --thbg:rgba(173,220,0,.22);--thc:#d3f56a;--zeb:rgba(255,255,255,.03);\n --spbg:#1a1c1e;--spbd:rgba(255,255,255,.10);--spc:#d4d6d9}\n/* ── MODO CLARO (al pulsar el interruptor) ── */\n#cx-mock.cx-light{--gb:#fafafa;--sf:#ffffff;--sf2:#f1f1ea;--bl:#e6e6e2;\n --ink:#141414;--mut:#3f4653;--fnt:#74747a;\n --br:#addc00;--bi:#5a8a00;--bbg:rgba(150,180,0,.13);--bln:rgba(150,180,0,.34);\n --steel:#1a6ea3;--steel2:#1a6ea3;--warn:#c0392b;--wbg:#fdecea;--wln:#f0c4be;--ok:#2f8a5c;\n --ind:#2563eb;--ind-bg:rgba(37,99,235,.06);--ind-ln:rgba(37,99,235,.40);\n --par:#dc2626;--par-bg:rgba(220,38,38,.06);--par-ln:rgba(220,38,38,.40);\n --sky-pale:#f1f1ea;\n --q-ic-bg:rgba(173,220,0,.18);--q-ic-stroke:#5a8a00;--q-arrow:#141414;--q-line:rgba(20,20,20,.12);\n --lime-cite:#6b8e00;\n --thbg:rgba(150,180,0,.30);--thc:#4a7000;--zeb:#f6f7f9;\n --spbg:#ffffff;--spbd:#ececec;--spc:#4a4a4a}\n#cx-mock .cx-hml{display:flex;align-items:center;gap:9px;margin-bottom:10px}\n#cx-mock .cx-hml i{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:cxpz 2s ease-in-out infinite}\n@keyframes cxpz {0%,100%{opacity:1}50%{opacity:.35}}\n#cx-mock .cx-hml span{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--lime-t)}\n/* el propio contenedor: la regla original apuntaba a un hijo inexistente */\n#cx-mock{position:relative;overflow:hidden;padding:0;width:100%;\n height:480px;border-radius:var(--r-lg);\n border:0.5px solid var(--border-hi);background:var(--gb);\n box-shadow:0 18px 50px rgba(0,0,0,.58);\n transition:background .28s ease}\n#cx-mock .cx-sc, #cx-mock .cx-ab, #cx-mock .cx-cat, #cx-mock .cx-tbl,\n#cx-mock .cx-scen, #cx-mock .cx-sbox, #cx-mock .cx-cl-col, #cx-mock .cx-tw,\n#cx-mock .cx-fld{transition:background .28s ease, border-color .28s ease, color .28s ease}\n@media(max-width:900px){ #cx-mock{ height:440px; margin-top:0 } }\n\n/* ═══ INTERRUPTOR CLARO / OSCURO DE LA VISTA PREVIA ═══\n   Vive FUERA del marco (#cx-mock) porque el JS reescribe su innerHTML.\n   Arranca en oscuro: sin la clase .cx-light el mock usa la paleta del tema. */\n.hero-mockup-label{ display:flex !important; align-items:center; gap:10px; margin-bottom:10px; }\n.hero-mockup-label .hml-dot, .hero-mockup-label .hml-text{ display:none; }\n@media(max-width:900px){\n  .hero-mockup-label .hml-dot{ display:block; }\n  .hero-mockup-label .hml-text{ display:inline; }\n}\n.cx-tgl{ margin-left:auto; display:inline-flex; align-items:center; gap:9px;\n  background:none; border:none; padding:4px; cursor:pointer; border-radius:var(--r-pill,20px);\n  -webkit-tap-highlight-color:transparent; }\n.cx-tgl-hint{ font-family:var(--mono,'IBM Plex Mono',monospace); font-size:9.5px; font-weight:600;\n  letter-spacing:.09em; text-transform:uppercase; color:var(--t3); white-space:nowrap;\n  transition:opacity .3s ease, transform .3s ease; }\n.cx-tgl.cx-used .cx-tgl-hint{ opacity:0; transform:translateX(6px); pointer-events:none; }\n.cx-tgl-track{ position:relative; width:46px; height:24px; flex:none; border-radius:999px;\n  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);\n  transition:background .25s ease, border-color .25s ease; }\n.cx-tgl-thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;\n  background:var(--lime,#addc00); transition:transform .28s cubic-bezier(.33,0,.2,1); }\n.cx-tgl[aria-checked=\"true\"] .cx-tgl-thumb{ transform:translateX(22px); }\n.cx-tgl-i{ position:absolute; top:6px; width:12px; height:12px; fill:none; stroke-width:2;\n  stroke-linecap:round; stroke-linejoin:round; transition:stroke .25s ease; }\n.cx-tgl-moon{ left:5px; stroke:#1a2400; }\n.cx-tgl-sun{ right:5px; stroke:var(- x;z-index:20;pointer-events:none;opacity:0;\n transition:transform var(--tcu,.5s) cubic-bezier(.33,0,.2,1),opacity .2s}\n#cx-mock .cx-cur.cx-vis{opacity:1}\n#cx-mock .cx-ring{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;\n border:2px solid var(--lime);opacity:0}\n#cx-mock .cx-cur.cx-tap .cx-ring{animation:cxtp .55s ease-out}\n@keyframes cxtp {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}\n\n\n/* ─────────── */\n\n\n/* ══════════════════════════════════════════════════════════════════\n   TABLA COMPARATIVA EN MÓVIL — vista completa, sin scroll lateral\n   La tabla se dibuja a su ancho natural y se reduce con transform,\n   como una imagen. Escritorio intacto: todo vive en ≤760px.\n   ══════════════════════════════════════════════════════════════════ */\n@media (max-width:760px){\n  .cmp-slot{ position:relative; }\n  .cmp-box{ position:relative; overflow:hidden; border-radius:var(--r-lg); }\n\n  .cmp-box .cmp-wrap{ overflow:hidden !important;\n                      transform-origin:top left;\n                      box-shadow:none !important;\n                      opacity:1 !important;      /* la escala pisa el .reveal */\n                      transition:none !important; }\n  /* en la miniatura sobran los matices: estorban y encogen la letra */\n  .cmp-box .cmp-e, .cmp-box .cnote, .cmp-box .rnote{ display:none !important; }\n  .cmp-box .cmp{ min-width:0 !important; width:470px !important; font-size:12.5px !important; }\n  .cmp-box .cmp th, .cmp-box .cmp td{ padding:9px 6px !important; }\n  /* sin nowrap los títulos parten línea y las columnas encogen:\n     la tabla mide menos y la miniatura se ve más grande */\n  .cmp-box .cmp thead th, .cmp-box .cmp .cmp-n{ white-space:normal !important; }\n  .cmp-box .cmp thead th:first-child,\n  .cmp-box .cmp tbody th, .cmp-box .cmp tfoot th{ min-width:132px !important; }\n  .cmp-box .cmp thead th:not(:first-child),\n  .cmp-box .cmp tbody td:not(:first-child){ min-width:76px !important; }\n\n  #swipe-hint{ display:none !important; }      /* ya no se desliza: entra entera */\n}\n\n\n/* ─────────── */\n\n\n/* la línea corta del pie solo existe en móvil */\n.f-desc-mob{ display:none; }\n\n/* ══════════════════════════════════════════════════════════════════\n   CAPA MÓVIL v3 — COMPACTACIÓN  (≤760px)\n   · Nada de esto toca el escritorio: TODO vive dentro de\n     @media (max-width:760px), salvo los elementos inyectados por JS,\n     que nacen con display:none y solo se encienden dentro del media.\n   · Objetivo: menos scroll, misma información. Lo largo se pliega\n     (acordeones), lo duplicado se oculta, el ritmo se aprieta.\n   ══════════════════════════════════════════════════════════════════ */\n\n/* elementos que inyecta el JS: invisibles fuera del móvil */\n.m-chev, .m-tg{ display:none; }\n\n@media (max-width:760px){\n\n  /* ── 1 · RITMO GLOBAL ─────────────────────────────────────── */\n  .pA,\n  #problema, #producto, #comparativa, #contenido, #precios, #faq{\n    padding:48px 0 !important;\n  }\n  section[id]{ scroll-margin-top:62px; }          /* la cabecera es sticky */\n  /* interlineado más suelto: a 24px y tres líneas, 1.14 ahogaba el título */\n  .pA h2{ font-size:24px !important; line-height:1.22 !important;\n          margin-bottom:14px !important; }\n  .pA .lead{ font-size:15px !important; line-height:1.62 !important; }\n  .pA .eyebrow{ font-size:10px !important; margin-bottom:12px !important; }\n  /* el <br> se queda: sin él las dos frases se pegan (\"sepas.Es que\") */\n  #problema h2 br{ display:inline !important; }\n\n  /* ── 2 · HERO ─────────────────────────────────────────────── */\n  .banner{ font-size:11px !important; padding:7px 12px !important; }\n  .hero{ padding:22px 0 30px !important; }\n  .hero-inner{ gap:20px !important; }\n  .hero-eyebrow{ margin-bottom:11px !important; padding:4px 10px !important; }\n  h1.hero-title{ font-size:29px !important; line-height:1.14 !important;\n                 margin-bottom:14px !important; }\n  .hero-sub{ font-size:15px !important; line-height:1.62 !important;\n             margin-bottom:20px !important; }\n\n  /* los dos botones caben lado a lado: −56px de alto */\n  .hero-actions{ grid-template-columns:1fr 1fr !important;\n                 gap:9px !important; margin-bottom:20px !important; }\n  .hero-actions a{ padding:15px 8px !important; font-size:13.5px !important; }\n\n  .proof-item{ padding:12px 8px !important; }\n  .proof-n{ font-size:17px !important; }\n  .proof-l{ font-size:8.5px !important; line-height:1.25; }\n\n  .hero-mockup-label{ margin-bottom:8px !important; }\n  .hero-mockup-label .hml-text{ font-size:10px; }\n  #cx-mock{ height:420px; }\n\n  /* ── 3 · FUENTES ──────────────────────────────────────────── */\n  .fuentes{ padding:13px 0 !important; }\n  .fuentes-lbl{ margin-bottom:9px !important; font-size:9.5px; }\n  .fuentes-marq span{ font-size:11px; }\n\n  /* ── 4 · EL PROBLEMA → acordeón ───────────────────────────── */\n  #problema .g3{ gap:9px !important; margin-top:26px !important; }\n  #problema .card{ padding:16px 42px 16px 17px !important; position:relative; }\n  #problema .card .num{ margin-bottom:7px !important; font-size:10px !important; }\n  #problema .card h3{ font-size:16.5px !important; line-height:1.25 !important;\n                      margin-bottom:0 !important; }\n  #problema .card p{ display:none; }\n  #problema .card.m-open p{ display:block; font-size:14px !important;\n                            line-height:1.6 !important;\n                            margin-top:10px; animation:mFade .18s ease; }\n  #problema .card-cta{ padding-right:15px !important; }\n  #problema .card-cta p{ display:block !important; font-size:13.5px !important;\n                         margin-top:8px; }\n\n  /* ── 5 · PRODUCTO ─────────────────────────────────────────── */\n  .vpwrap{ margin-top:20px !important; }\n  .vpindex{ margin:0 -18px 14px !important; padding:0 18px 4px !important; }\n  .vpi{ padding:9px 12px !important; font-size:11.5px !important; min-height:38px !important; }\n  .vp-claim{ margin-bottom:12px !important; }\n  .vp-n{ margin-bottom:5px !important; }\n  .vp-claim h3{ font-size:19px !important; line-height:1.24 !important; }\n  .vp-claim p{ font-size:14px !important; line-height:1.6 !important; }\n  .vp-tag{ padding:7px 12px !important; font-size:8px !important; }\n  .vp-exhibit .gv{ max-height:min(58vh,430px) !important; }\n  /* el fragmento deja de ir a sangre: vuelve a ser una tarjeta dentro\n     del margen de 18px, con esquinas y borde en los cuatro lados */\n  .vp-exhibit{ margin:0 !important; border-radius:var(--r-lg) !important;\n               border-left:1px solid var(--border) !important;\n               border-right:1px solid var(--border) !important; }\n  .vp-exhibit::after{ left:1px !important; right:9px !important;\n                      border-radius:0 0 var(--r-lg) var(--r-lg) !important; }\n  /* al perder 36px de ancho, la barra del fragmento dejaba \"Mi cuenta\"\n     cortada contra el borde: se aprieta en vez de desbordarse */\n  .gv .hnav{ gap:10px !important; padding-left:13px !important; padding-right:13px !important; }\n  .gv .hlogo{ font-size:12px !important; min-width:0; overflow:hidden;\n              text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto !important; }\n  .gv .hnav .hsp{ gap:10px !important; }\n  .gv .hacct{ font-size:11.5px !important; padding:5px 11px !important; }\n  .gv > .wrapg:first-child{ padding-top:14px; }\n\n  /* ── 6 · COMPARATIVA ──────────────────────────────────────── */\n  #swipe-hint{ font-size:10px !important; margin:18px 0 6px !important; }\n  .cmp{ min-width:600px !important; font-size:11px !important; }\n  .cmp th, .cmp td{ padding:8px 7px !important; }\n  .cmp thead th:first-child, .cmp tbody th, .cmp tfoot th{ min-width:126px !important; }\n  .cmp thead th:not(:first-child), .cmp tbody td:not(:first-child){ min-width:84px !important; }\n  .cmp-key{ gap:9px !important; font-size:10px !important; m I 2025<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ EL PROBLEMA ══ -->\n<section class=\"pA light\" id=\"problema\" data-sec=\"pain\">\n  <div class=\"wrap\">\n    <div class=\"sec-narrow center reveal\">\n      <div class=\"eyebrow\">El problema real<\u002Fdiv>\n      <h2>No es que no sepas.<br>Es que la respuesta está en 100 páginas y en inglés.<\u002Fh2>\n      <p class=\"lead\">¿Te suena alguna de estas situaciones? Se repiten en cualquier turno de Colombia. Si reconoces tres, esto es para ti.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"g3 reveal\" style=\"margin-top:44px\">\n      <div class=\"card\"><span class=\"num\">01<\u002Fspan><h3>Te graduaste. El conocimiento siguió cambiando.<\u002Fh3><p>Nadie te enseñó a sostener diez guías internacionales al día mientras trabajas. Cientos de páginas, en inglés, actualizadas sin aviso. Nosotros las leemos, las unificamos y te las dejamos en español, con la fuente citada.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><span class=\"num\">02<\u002Fspan><h3>Dos guías dicen cosas distintas<\u002Fh3><p>La ESC agrupa donde la ACC/AHA separa. En vez de esconderlo, te mostramos las dos recomendaciones, de quién es cada una y la marcamos como <span class=\"disc\">discrepancia<\u002Fspan>.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><span class=\"num\">03<\u002Fspan><h3>Tienes que sustentar la conducta<\u002Fh3><p>Ante un comité, una junta o una historia clínica revisada: cada dato lleva sociedad, año, sección y página. No \"según la literatura\" — <span class=\"cite\">[ESC 2023, §3.2.1, p. 3738]<\u002Fspan>.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><span class=\"num\">04<\u002Fspan><h3>La IA responde rápido y a veces alucina<\u002Fh3><p>Y no puedes evaluarla si no conoces las guías vigentes. Clinical Hub no reemplaza tu criterio: te da la fuente con la que juzgas cualquier respuesta, venga de donde venga.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><span class=\"num\">05<\u002Fspan><h3>Traduces bajo presión<\u002Fh3><p>Una recomendación mal leída en inglés cambia una dosis. Todo está en español clínico, revisado por médicos, con el término original cuando importa.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><span class=\"num\">06<\u002Fspan><h3>La guía te da un rango. La experiencia te dice qué cifra usar.<\u002Fh3><p>Cada tema lleva <span class=\"disc exp\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1-5.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z\"><\u002Fpath><path d=\"M8 11h.01M12 11h.01M16 11h.01\"><\u002Fpath><\u002Fsvg>puntos complementarios basados en la experiencia<\u002Fspan> donde especialistas y médicos con años de práctica dicen qué funciona y dónde ponerse dentro del rango — hoy en texto, pronto en video de procedimientos grabados por el especialista.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"pA\" id=\"producto\" data-sec=\"product\">\n  <div class=\"wrap\">\n    <div class=\"sec-narrow reveal\">\n      <div class=\"eyebrow\">Qué es Clinical Hub<\u002Fdiv>\n      <h2>Esto es lo que contiene <span class=\"lime\">Clinical Hub<\u002Fspan><\u002Fh2>\n      <p class=\"lead\">Ocho elementos, y no son extras de algunos temas: están en todos. Cada uno viene con su prueba — un fragmento real de la plataforma, sin retocar.<\u002Fp>\n    <\u002Fdiv>\n\n<div class=\"vpwrap reveal\">\n      <div class=\"vpindex\" role=\"tablist\">\n        <button class=\"vpi on\" data-vp=\"home\"><b>01<\u002Fb>Eliges por patología<\u002Fbutton>\n        <button class=\"vpi\" data-vp=\"preg\"><b>02<\u002Fb>Entras por la pregunta<\u002Fbutton>\n        <button class=\"vpi\" data-vp=\"algo\"><b>03<\u002Fb>Algoritmo maestro<\u002Fbutton>\n        <button class=\"vpi\" data-vp=\"ref\"><b>04<\u002Fb>Todo referenciado<\u002Fbutton>\n        <button class=\"vpi\" data-vp=\"tool\"><b>05<\u002Fb>Herramientas que usas<\u002Fbutton>\n        <button c
